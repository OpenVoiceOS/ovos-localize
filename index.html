<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVOS Localize — Help translate OpenVoiceOS skills</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ovos: { bg: '#0a0a0a', card: '#171717', accent: '#ef4444', text: '#e5e5e5', muted: '#737373', input: '#262626', hover: '#1f1f1f' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #ef4444; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace; }
    .slot { color: #fbbf24; font-weight: 600; font-family: ui-monospace, monospace; }
    .badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: #166534; color: #86efac; }
    .badge-amber { background: #713f12; color: #fde047; }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #450a0a; color: #fca5a5; }
    .badge-gray { background: #262626; color: #a3a3a3; }
    textarea { tab-size: 4; }
    textarea:focus { outline: 2px solid #ef4444; outline-offset: -1px; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 50;
      padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-size: 0.875rem;
      animation: slideUp 0.25s ease-out; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; } }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #525252;
      border-top-color: #ef4444; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: flex; align-items: center; justify-content: center; }
    .modal { background: #171717; border: 1px solid #262626; border-radius: 0.75rem; padding: 1.5rem; max-width: 32rem; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    /* Tooltip */
    [data-tip] { position: relative; cursor: help; }
    [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #0a0a0a; border: 1px solid #262626; color: #e5e5e5; padding: 0.375rem 0.625rem;
      border-radius: 0.375rem; font-size: 0.75rem; white-space: nowrap; z-index: 30; max-width: 20rem;
      white-space: normal; text-align: center; pointer-events: none;
    }
    /* Info callout */
    .callout { background: #171717; border-left: 3px solid #ef4444; padding: 0.75rem 1rem; border-radius: 0 0.375rem 0.375rem 0; }
    .callout-warn { border-left-color: #f59e0b; }
    /* Progress bar */
    .progress-bar { height: 0.375rem; border-radius: 9999px; background: #334155; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
    /* Hover cards */
    .skill-card { transition: transform 0.15s, box-shadow 0.15s; }
    .skill-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    /* Search */
    .search-box { background: #171717; border: 1px solid #262626; border-radius: 0.5rem; }
    .search-box:focus-within { border-color: #ef4444; }
    /* README content styling */
    .readme-content { color: #e5e5e5; line-height: 1.6; }
    .readme-content h1, .readme-content h2, .readme-content h3 { font-weight: bold; margin: 1em 0 0.5em; border-bottom: 1px solid #262626; padding-bottom: 0.3em; }
    .readme-content h1 { font-size: 1.5em; }
    .readme-content h2 { font-size: 1.25em; }
    .readme-content h3 { font-size: 1.1em; border: none; }
    .readme-content p { margin: 0.5em 0; }
    .readme-content ul, .readme-content ol { margin: 0.5em 0; padding-left: 1.5em; }
    .readme-content li { margin: 0.25em 0; }
    .readme-content code { background: #262626; padding: 0.15em 0.4em; border-radius: 0.25em; font-size: 0.9em; }
    .readme-content pre { background: #171717; padding: 0.75em; border-radius: 0.5em; overflow-x: auto; margin: 0.5em 0; }
    .readme-content pre code { background: none; padding: 0; }
    .readme-content a { color: #ef4444; }
    .readme-content img { max-width: 100%; border-radius: 0.5em; }
    .readme-content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
    .readme-content th, .readme-content td { border: 1px solid #262626; padding: 0.4em 0.6em; text-align: left; }
    .readme-content th { background: #171717; }
    .readme-content blockquote { border-left: 3px solid #ef4444; padding-left: 1em; color: #a3a3a3; margin: 0.5em 0; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ===== HEADER ===== -->
  <header class="border-b border-ovos-card px-6 py-3 flex items-center gap-4 sticky top-0 bg-ovos-bg z-20">
    <a href="#/" class="flex items-center gap-2 hover:no-underline">
      <img src="logo.png" alt="OVOS" width="32" height="32" class="rounded">
      <span class="text-lg font-bold text-ovos-accent">OVOS Localize</span>
    </a>
    <nav class="hidden sm:flex gap-4 ml-4 text-sm">
      <a href="#/" class="text-ovos-muted hover:text-ovos-text">Dashboard</a>
      <a href="#/stats" class="text-ovos-muted hover:text-ovos-text">Stats</a>
      <a href="#/entities" class="text-ovos-muted hover:text-ovos-text">Entities</a>
      <a href="#/open-data" class="text-ovos-muted hover:text-ovos-text">Open Data</a>
      <a href="#/how-it-works" class="text-ovos-muted hover:text-ovos-text">How it works</a>
      <a href="#/issues" class="text-ovos-muted hover:text-ovos-text">Issues</a>
      <a href="#/submit-skill" class="text-ovos-muted hover:text-ovos-text">Submit Skill</a>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="showOnboarding()" id="profile-btn" class="text-sm px-3 py-1.5 rounded-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-2" title="Your languages">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Set languages
      </button>
    </div>
  </header>

  <main id="app" class="mx-auto px-4 sm:px-6 py-6"></main>

  <footer class="border-t border-ovos-card mt-12 py-6 px-6 text-center text-xs text-ovos-muted">
    <p>Developed by <a href="https://tigregotico.pt" target="_blank" class="font-medium">TigreGoticoLda</a> with <span class="text-red-500">&hearts;</span> for the <a href="https://openvoiceos.org" target="_blank" class="font-medium">OpenVoiceOS</a> community</p>
    <div class="mt-2 flex items-center justify-center gap-4">
      <a href="https://github.com/OpenVoiceOS/ovos-localize" target="_blank">GitHub</a>
      <a href="#/how-it-works">How it works</a>
      <a href="#/stats">Stats</a>
      <a href="#/entities">Entities</a>
      <a href="https://matrix.to/#/#OpenVoiceOS:matrix.org" target="_blank">Matrix Chat</a>
    </div>
  </footer>
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <script>
    // =========================================================================
    // SUBMISSION (via GitHub Issues — zero auth required)
    // =========================================================================
    const LOCALIZE_REPO = 'OpenVoiceOS/ovos-localize';

    // Human-first languages — the editor's per-string auto-translate
    // suggestion is intentionally hidden. These languages have little to no
    // machine-translation signal, so a suggestion would be unreliable and
    // risks anchoring the translator to a bad first draft instead of
    // translating directly from the English source.
    const HUMAN_FIRST_LANGS = new Set(['kab']); // Kabyle — issue #208

    /**
     * Submit a translation by opening a pre-filled GitHub Issue.
     * A GitHub Action picks it up, creates a PR, and closes the issue.
     * The user only needs to be logged into GitHub — zero tokens required.
     */
    function submitTranslation(org, repo, filePath, newContent, lang, fileKey, branch) {
      const b64Content = btoa(unescape(encodeURIComponent(newContent)));

      const title = encodeURIComponent(`[translate] ${lang}: ${org}/${repo} — ${fileKey}`);
      const body = encodeURIComponent(
        `> Submitted via [OVOS Localize](https://openvoiceos.github.io/ovos-localize/). ` +
        `A bot will create a PR automatically.\n\n` +
        `<!-- TRANSLATION_META\n` +
        `org: ${org}\n` +
        `repo: ${repo}\n` +
        `file_path: ${filePath}\n` +
        `lang: ${lang}\n` +
        `file_key: ${fileKey}\n` +
        `branch: ${branch}\n` +
        `-->\n\n` +
        `<content>\n${b64Content}\n</content>`
      );

      window.open(`https://github.com/${LOCALIZE_REPO}/issues/new?title=${title}&labels=translation&body=${body}`, '_blank');
      toast('GitHub issue page opened — click "Submit new issue" to complete.', 'green', 6000);
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    async function showReadme(repoFullName) {
      const el = document.getElementById('modal-container');
      el.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:48rem;max-height:85vh;display:flex;flex-direction:column">
            <div class="flex items-center justify-between mb-3 flex-shrink-0">
              <h3 class="text-lg font-bold">README — ${escapeHtml(repoFullName)}</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text px-2">&times;</button>
            </div>
            <div class="flex-1 overflow-auto text-sm text-ovos-muted flex items-center justify-center">
              <span class="spinner"></span>&nbsp; Loading...
            </div>
          </div>
        </div>`;
      try {
        const r = await fetch('https://api.github.com/repos/' + repoFullName + '/readme', {
          headers: { 'Accept': 'application/vnd.github.html+json' },
          signal: AbortSignal.timeout(15000),
        });
        if (!r.ok) throw new Error(r.status === 404 ? 'No README found' : 'GitHub API ' + r.status);
        const html = await r.text();
        const content = el.querySelector('.overflow-auto');
        content.className = 'flex-1 overflow-auto text-sm readme-content p-1';
        content.innerHTML = html;
      } catch (e) {
        const content = el.querySelector('.overflow-auto');
        content.innerHTML = '<p class="text-red-400">Failed to load README: ' + escapeHtml(e.message) + '</p><p class="mt-2"><a href="https://github.com/' + repoFullName + '#readme" target="_blank">View on GitHub</a></p>';
      }
    }

    // =========================================================================
    // USER PROFILE (localStorage — languages)
    // =========================================================================
    function getProfile() {
      const p = localStorage.getItem('ovos_profile');
      return p ? JSON.parse(p) : null;
    }
    function saveProfile(profile) {
      localStorage.setItem('ovos_profile', JSON.stringify(profile));
      updateProfileUI();
    }
    function getUserLangs() {
      const p = getProfile();
      return p?.languages || ['en-US'];
    }
    function hasCompletedOnboarding() { return true; }

    function updateProfileUI() {
      const btn = document.getElementById('profile-btn');
      if (!btn) return;
      const p = getProfile();
      if (p) {
        const langCount = p.languages.length;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>${langCount} lang${langCount !== 1 ? 's' : ''}`;
        btn.title = `Your languages: ${p.languages.join(', ')}`;
      } else {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Set languages`;
      }
    }

    async function showOnboarding() {
      let langMeta = {};
      try {
        const coverage = await fetchJSON('data/coverage.json');
        langMeta = coverage.lang_meta || {};
      } catch {}

      const allLangs = Object.keys(langMeta).sort((a, b) => {
        const na = langMeta[a]?.native || a;
        const nb = langMeta[b]?.native || b;
        return na.localeCompare(nb);
      });

      const existing = getProfile();
      const selectedSet = new Set(existing?.languages || []);

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:36rem">
            <div class="text-center mb-4">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <h2 class="text-xl font-bold">${existing ? 'Update your languages' : 'Welcome to OVOS Localize!'}</h2>
              <p class="text-sm text-ovos-muted mt-1">${existing ? 'Change which languages you see.' : 'What languages do you speak? We will only show skills that need help in your languages.'}</p>
            </div>
            <div class="mb-3">
              <div class="search-box flex items-center px-3 py-2 gap-2 mb-3">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="lang-search" type="text" placeholder="Search languages..." class="bg-transparent text-sm text-ovos-text w-full outline-none placeholder-ovos-muted" oninput="filterOnboardingLangs()">
              </div>
              <div id="lang-grid" class="grid grid-cols-2 gap-1.5 max-h-64 overflow-auto pr-1">
                ${allLangs.map(code => {
                  const m = langMeta[code] || {};
                  const checked = selectedSet.has(code) ? 'checked' : '';
                  return `<label class="lang-option flex items-center gap-2 p-2 rounded-lg hover:bg-ovos-hover cursor-pointer text-sm" data-code="${code}" data-search="${(m.native||'').toLowerCase()} ${(m.display||'').toLowerCase()} ${code.toLowerCase()}">
                    <input type="checkbox" value="${code}" class="lang-cb accent-red-500 w-4 h-4" ${checked} onchange="updateOnboardingCount()">
                    <div>
                      <div class="font-medium">${escapeHtml(m.native || code)}</div>
                      <div class="text-xs text-ovos-muted">${escapeHtml(m.display || code)}</div>
                    </div>
                  </label>`;
                }).join('')}
              </div>
              <div class="mt-2 text-xs text-ovos-muted"><span id="onboarding-count">${selectedSet.size}</span> language${selectedSet.size !== 1 ? 's' : ''} selected</div>
            </div>
            <div class="flex items-center justify-between">
              <button onclick="closeModal();showRequestLangModal()" class="text-xs text-ovos-muted hover:text-ovos-text">Can't find your language? Request it</button>
              <div class="flex gap-2">
                ${existing ? '<button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover">Cancel</button>' : ''}
                <button onclick="saveOnboarding()" id="save-onboarding-btn" class="px-4 py-2 text-sm rounded-lg bg-ovos-accent text-ovos-bg font-bold hover:opacity-80 disabled:opacity-40" ${selectedSet.size === 0 && !existing ? 'disabled' : ''}>
                  ${existing ? 'Save' : 'Get started'}
                </button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function filterOnboardingLangs() {
      const q = (document.getElementById('lang-search')?.value || '').toLowerCase();
      document.querySelectorAll('.lang-option').forEach(el => {
        el.style.display = el.dataset.search.includes(q) ? '' : 'none';
      });
    }

    function updateOnboardingCount() {
      const count = document.querySelectorAll('.lang-cb:checked').length;
      const el = document.getElementById('onboarding-count');
      if (el) el.textContent = count;
      const btn = document.getElementById('save-onboarding-btn');
      if (btn) btn.disabled = count === 0;
    }

    function saveOnboarding() {
      const selected = Array.from(document.querySelectorAll('.lang-cb:checked')).map(cb => cb.value);
      if (selected.length === 0) { toast('Select at least one language', 'amber'); return; }
      const isFirst = !hasCompletedOnboarding();
      saveProfile({ languages: selected, createdAt: new Date().toISOString() });
      closeModal();
      toast(`Showing ${selected.length} language${selected.length > 1 ? 's' : ''}`, 'green');
      if (isFirst) {
        location.hash = '#/dashboard';
      } else {
        route();
      }
    }

    function showRequestLangModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:28rem">
            <div class="text-center mb-4">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
              <h3 class="text-lg font-bold">Request a new language</h3>
              <p class="text-sm text-ovos-muted mt-1">If your language isn't listed, we can add it!</p>
            </div>
            <div class="space-y-3 mb-4">
              <div>
                <label class="text-xs font-bold text-ovos-muted">Language name</label>
                <input id="req-lang-name" type="text" placeholder="e.g. Hindi, Swahili, Korean..."
                  class="mt-1 w-full bg-ovos-input text-ovos-text px-3 py-2 rounded-lg border border-ovos-card text-sm">
              </div>
              <div>
                <label class="text-xs font-bold text-ovos-muted">Language code <span class="font-normal text-ovos-muted">(BCP-47, e.g. hi-IN)</span></label>
                <input id="req-lang-code" type="text" placeholder="e.g. hi-IN"
                  class="mt-1 w-full bg-ovos-input text-ovos-text px-3 py-2 rounded-lg border border-ovos-card text-sm mono">
              </div>
            </div>
            <button onclick="submitLangRequest()" class="w-full px-4 py-2.5 text-sm rounded-lg bg-ovos-accent text-white font-bold hover:opacity-80 mb-3">
              Open request on GitHub
            </button>
            <div class="mt-3 text-center">
              <button onclick="closeModal()" class="text-sm text-ovos-muted hover:text-ovos-text">Cancel</button>
            </div>
          </div>
        </div>`;
      setTimeout(() => document.getElementById('req-lang-name')?.focus(), 100);
    }

    function submitLangRequest() {
      const name = document.getElementById('req-lang-name')?.value.trim();
      const code = document.getElementById('req-lang-code')?.value.trim();
      if (!name) { toast('Enter a language name', 'amber'); return; }
      if (!code) { toast('Enter a BCP-47 language code (e.g. hi-IN)', 'amber'); return; }
      if (!/^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,})*$/.test(code)) {
        toast('Invalid language code format. Use BCP-47, e.g. hi-IN', 'amber'); return;
      }
      const title = encodeURIComponent('Add language: ' + name + ' (' + code + ')');
      const enc = s => encodeURIComponent(s);
      const NL = '%0A';
      const body = [
        enc('<!-- NEW_LANGUAGE_META'),
        enc('name: ' + name),
        enc('code: ' + code),
        enc('-->'),
        '',
        enc('I am requesting the **' + name + '** (`' + code + '`) language to be added to OVOS Localize so I can start contributing translations.'),
      ].join(NL);
      window.open('https://github.com/OpenVoiceOS/ovos-localize/issues/new?title=' + title + '&body=' + body + '&labels=new-language', '_blank');
      closeModal();
    }

    // =========================================================================
    // UI HELPERS
    // =========================================================================
    function toast(msg, color = 'blue', duration = 3000) {
      const colors = { green: 'bg-green-800 text-green-200', red: 'bg-red-800 text-red-200', blue: 'bg-neutral-800 text-neutral-200', amber: 'bg-amber-800 text-amber-200' };
      const id = 't' + Date.now();
      document.getElementById('toast-container').innerHTML = `<div id="${id}" class="toast ${colors[color]||colors.blue}">${escapeHtml(msg)}</div>`;
      if (duration > 0) setTimeout(() => document.getElementById(id)?.remove(), duration);
    }
    function showProgress(msg) {
      document.getElementById('toast-container').innerHTML = `<div class="toast bg-neutral-800 text-neutral-200 flex items-center gap-2"><span class="spinner"></span>${escapeHtml(msg)}</div>`;
    }
    function hideProgress() { document.getElementById('toast-container').innerHTML = ''; }

    const cache = {};
    async function fetchJSON(url) {
      if (cache[url]) return cache[url];
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Failed to fetch ${url}: ${r.status}`);
      const d = await r.json();
      cache[url] = d;
      return d;
    }

    async function fetchSkill(skillId) {
      const skill = await fetchJSON(`data/skills/${skillId}.json`);
      if (skill.chunks && skill.chunks.length > 0) {
        for (const chunk of skill.chunks) {
          const chunkData = await fetchJSON(`data/skills/${chunk}`);
          if (chunkData.files) {
            Object.assign(skill.files, chunkData.files);
          }
        }
      }
      return skill;
    }

    // =========================================================================

    // OVOS TRANSLATION API (auto-translate via community servers)
    // =========================================================================
    const TRANSLATE_SERVERS = [
      { name: "NLLB - Smart'Gic", url: "https://translator.smartgic.io/nllb" },
      { name: "NLLB - Ziggyai", url: "https://ovosnllb.ziggyai.online" },
      { name: "NLLB - TigreGotico", url: "https://nllb.tigregotico.pt" },
      { name: "Google Translate - TigreGotico", url: "https://google-translate.tigregotico.pt" },
    ];

    function getTranslateServer() {
      return localStorage.getItem('ovos_tx_server') || TRANSLATE_SERVERS[0].url;
    }
    function setTranslateServer(url) {
      localStorage.setItem('ovos_tx_server', url);
    }

    /** Check server status via GET /status */
    async function checkTxServerStatus(serverUrl) {
      try {
        const r = await fetch(`${serverUrl}/status`, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return { ok: false, error: `HTTP ${r.status}` };
        const data = await r.json();
        return {
          ok: true,
          plugin: data.translation_plugin || data.plugin_type || 'unknown',
          langs: data.langs || data.languages || [],
        };
      } catch (e) {

    /** Strip region from BCP-47 for the translate API (e.g. pt-BR → pt, en-US → en) */
    function langToShort(code) {
      return code.split('-')[0].toLowerCase();
    }

    /**
     * Translate a single string via OVOS translate server.
     * GET /translate/{src}/{tgt}/{text}
     */
    async function ovsTranslate(text, srcLang, tgtLang, serverUrl) {
      const src = langToShort(srcLang);
      const tgt = langToShort(tgtLang);
      const url = `${serverUrl}/translate/${src}/${tgt}/${encodeURIComponent(text)}`;
      const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(`Translation server returned ${r.status}`);
      const data = await r.json().catch(() => r.text());
      return typeof data === 'string' ? data : (data.translation || data.translated || String(data));
    }

    /**
     * Auto-translate all lines from source to target language.
     * Translates line-by-line to preserve structure.
     */
    async function autoTranslateLines(lines, tgtLang, serverUrl, onProgress, srcLang = 'en-US') {
      const results = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith('#')) {
          results.push(line);
          continue;
        }
        // Preserve {slots} — replace with placeholders before translating
        const slots = [];
        const cleaned = line.replace(/\{(\w+)\}/g, (match) => {
          slots.push(match);
          return `__SLOT${slots.length - 1}__`;
        });
        // Preserve (a|b) alternatives — translate each option separately
        const altGroups = [];
        const withoutAlts = cleaned.replace(/\(([^)]+)\)/g, (match, group) => {
          altGroups.push(group);
          return `__ALT${altGroups.length - 1}__`;
        });

        let translated;
        try {
          translated = await ovsTranslate(withoutAlts, srcLang, tgtLang, serverUrl);
        } catch {
          translated = withoutAlts; // Keep original on failure
        }

        // Restore alternatives (translate each option)
        for (let j = 0; j < altGroups.length; j++) {
          const options = altGroups[j].split('|');
          const translatedOpts = [];
          for (const opt of options) {
            if (!opt.trim()) { translatedOpts.push(''); continue; }
            try {
              translatedOpts.push(await ovsTranslate(opt.trim(), srcLang, tgtLang, serverUrl));
            } catch {
              translatedOpts.push(opt);
            }
          }
          translated = translated.replace(`__ALT${j}__`, `(${translatedOpts.join('|')})`);
        }

        // Restore slots
        for (let j = 0; j < slots.length; j++) {
          translated = translated.replace(`__SLOT${j}__`, slots[j]);
        }

        results.push(translated);
        if (onProgress) onProgress(i + 1, lines.length);
      }
      return results;
    }

    function coverageBadge(pct) {
      if (pct == null) return '<span class="badge badge-gray">missing</span>';
      const cls = pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-red';
      return `<span class="badge ${cls}">${pct.toFixed(0)}%</span>`;

    function highlightSlots(text) { return text.replace(/\{(\w+)\}/g, '<span class="slot">{$1}</span>'); }
    function highlightCodeStrings(code) {
      // Highlight string literals (single and double quoted)
      return code
        .replace(/((?:&quot;|")[^"]*(?:&quot;|"))/g, '<span style="color:#a5d6ff">$1</span>')

    }
    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function filePathFromEditUrl(u) { const m = u.match(/\/edit\/[^/]+\/(.+)$/); return m ? m[1] : ''; }

    function progressBar(pct, size = 'sm') {
      const h = size === 'sm' ? 'h-1.5' : 'h-2.5';
      const color = pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';

    }

    // =========================================================================
    // TEMPLATE EXPANSION — port of ovos_utils.bracket_expansion.expand_template
    // =========================================================================
    function expandTemplate(template) {
      // [optional] → (optional|)
      let t = template.replace(/\[([^\[\]]+)\]/g, '($1|)');

      function expandAlternatives(text) {
        const parts = [];
        const segments = text.split(/(\([^()]+\))/);
        for (const seg of segments) {
          if (seg.startsWith('(') && seg.endsWith(')')) {
            parts.push(seg.slice(1, -1).split('|'));
          } else {
            parts.push([seg]);
          }
        }
        // Cartesian product
        return cartesian(parts).map(combo => combo.join('').replace(/\s+/g, ' ').trim());
      }

      function cartesian(arrays) {
        return arrays.reduce((acc, arr) => {
          const result = [];
          for (const a of acc) for (const b of arr) result.push([...a, b]);
          return result;
        }, [['']]);  // Start with array containing empty string, not empty array
      }

      // Iteratively expand until stable
      let result = new Set([t]);
      for (let i = 0; i < 10; i++) { // safety limit
        const expanded = new Set();
        for (const text of result) {
          for (const e of expandAlternatives(text)) expanded.add(e);
        }
        if (expanded.size === result.size && [...expanded].every(x => result.has(x))) break;
        result = expanded;
      }
      return [...result].filter(s => s.trim()).sort();
    }

    /** Expand all lines and return total count + sample */
    function expandAllLines(text, maxPerLine = 50, maxTotal = 200) {
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
      let total = 0;
      const samples = [];
      for (const line of lines) {
        const expanded = expandTemplate(line);
        total += expanded.length;
        // Keep some samples
        for (const e of expanded.slice(0, maxPerLine)) {
          if (samples.length < maxTotal) samples.push(e);
        }
      }
      return { total, samples, lineCount: lines.length };
    }

    function highlightJson(jsonStr) {
      return jsonStr
        .replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span style="color:#fca5a5">$1</span>:')  // keys in red
        .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span style="color:#86efac">$1</span>')  // string values in green
        .replace(/:\s*(true|false|null)/g, ': <span style="color:#fde047">$1</span>')     // booleans in yellow
        .replace(/:\s*(\d+(?:\.\d+)?)/g, ': <span style="color:#93c5fd">$1</span>');      // numbers in blue
    }

    async function route() {
      const hash = location.hash || '#/';
      const app = document.getElementById('app');
      app.innerHTML = '<div class="flex items-center gap-2 py-12 justify-center text-ovos-muted"><span class="spinner"></span> Loading...</div>';

      // Show onboarding on first visit — only for pages that need a user profile
      // Informational pages (stats, entities, open-data) are accessible without a profile
      const publicPages = ['#/', '', '#/how-it-works', '#/stats', '#/entities', '#/open-data', '#/issues', '#/submit-skill'];
      // Skill editor pages with an explicit lang in the URL are accessible without a profile
      // (the lang is encoded in the route, so no profile is needed to determine what to show)
      const isSkillEditorWithLang = /^#\/skill\/[^/]+\/[^/]+\/.+/.test(hash);
      if (!hasCompletedOnboarding() && !publicPages.includes(hash) && !isSkillEditorWithLang) {
        await renderLanding(app);
        return;
      }

      try {
        if (hash === '#/' || hash === '') await renderLanding(app);
        else if (hash === '#/how-it-works') renderHowItWorks(app);
        else if (hash === '#/stats') await renderStats(app);
        else if (hash === '#/entities') await renderEntities(app);
        else if (hash === '#/open-data') await renderOpenData(app);
        else if (hash === '#/issues') await renderIssues(app);
        else if (hash === '#/submit-skill') await renderSubmitSkill(app);
        else if (hash === '#/dashboard') await renderDashboard(app);
        else if (hash.match(/^#\/skill\/([^/]+)\/([^/]+)\/(.+)$/)) {
          // Editor: #/skill/{id}/{file}/{lang}
          const [, id, file, lang] = hash.match(/^#\/skill\/([^/]+)\/([^/]+)\/(.+)$/);
          await renderEditor(app, id, decodeURIComponent(file), decodeURIComponent(lang));
        } else if (hash.match(/^#\/skill\/([^/]+)\/(.+)$/)) {
          // Skill detail for a specific language: #/skill/{id}/{lang}
          const [, id, lang] = hash.match(/^#\/skill\/([^/]+)\/(.+)$/);
          await renderSkillDetail(app, id, decodeURIComponent(lang));
        } else if (hash.match(/^#\/skill\/([^/]+)$/)) {
          // Skill detail without language — redirect to first user lang
          const id = RegExp.$1;
          const uLangs = getUserLangs();
          const defaultLang = uLangs.length > 0 ? uLangs[0] : 'de-DE';
          location.hash = `#/skill/${id}/${defaultLang}`;
          return;
        } else app.innerHTML = '<p>Page not found. <a href="#/">Go home</a></p>';
      } catch(e) {
        app.innerHTML = `<div class="py-12 text-center"><p class="text-red-400 text-lg mb-2">Something went wrong</p><p class="text-ovos-muted text-sm mb-4">${escapeHtml(e.message)}</p><a href="#/" class="text-sm">Go home</a></div>`;
      }
    }

    function filterDashboard() {
      const { repos, coverage, langs, allLangs } = window._dashData;
      const search = (document.getElementById('skill-search')?.value || '').toLowerCase();
      const langFilterRaw = document.getElementById('lang-filter')?.value || '';
      const statusFilter = document.getElementById('status-filter')?.value || '';

      // Determine which languages to consider
      let langFilter = '';
      let displayLangsForCard;
      if (langFilterRaw === '__all__') {
        displayLangsForCard = allLangs;
      } else if (langFilterRaw) {
        langFilter = langFilterRaw;
        displayLangsForCard = [langFilterRaw];
      } else {
        displayLangsForCard = langs; // user's languages
      }
      const grid = document.getElementById('skill-grid');

      let filtered = repos;
      if (search) filtered = filtered.filter(r => r.id.includes(search) || (r.skill_class||'').toLowerCase().includes(search));

      let html = '';
      let count = 0;
      for (const repo of filtered) {
        const m = coverage.matrix[repo.id] || {};

        // Compute overall coverage for this skill
        let totalPct = 0, pctCount = 0;
        for (const l of displayLangsForCard) {
          if (m[l]?.combined_pct != null) { totalPct += m[l].combined_pct; pctCount++; }
        }
        const avgPct = pctCount > 0 ? totalPct / pctCount : 0;

        if (statusFilter === 'needs-work' && avgPct >= 50) continue;
        if (statusFilter === 'partial' && (avgPct < 50 || avgPct >= 80)) continue;
        if (statusFilter === 'good' && avgPct < 80) continue;

        // Find languages needing the most work
        const needsWork = [];
        for (const l of displayLangsForCard) {
          const pct = m[l]?.combined_pct;
          if (pct != null && pct < 80) needsWork.push({ lang: l, pct });
        }
        needsWork.sort((a, b) => a.pct - b.pct);

        count++;
        // Pick the best default language to link to
        const defaultLang = needsWork.length > 0 ? needsWork[0].lang : (displayLangsForCard[0] || 'en-US');

        html += `
          <div class="skill-card p-4 bg-ovos-card rounded-xl">
            <div class="flex items-start justify-between mb-2">
              <a href="#/skill/${repo.id}/${defaultLang}" class="hover:no-underline">
                <div class="font-bold text-ovos-text text-sm">${repo.id.replace('ovos-skill-', '')}</div>
                <div class="text-xs text-ovos-muted">${repo.skill_class || 'Unknown'}</div>
              </a>
              ${coverageBadge(avgPct > 0 ? avgPct : null)}
            </div>
            ${progressBar(avgPct)}
            <div class="mt-2 text-xs text-ovos-muted">${repo.languages.length} languages, ${repo.file_count} files</div>
            <div class="mt-2 flex flex-wrap gap-1">
              ${displayLangsForCard.map(l => {
                const pct = m[l]?.combined_pct;
                const cls = pct == null ? 'badge-gray' : pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-red';
                return `<a href="#/skill/${repo.id}/${l}" class="badge ${cls} hover:no-underline hover:opacity-80">${l} ${pct != null ? pct.toFixed(0)+'%' : 'new'}</a>`;
              }).join('')}
            </div>
          </div>`;
      }

      grid.innerHTML = html || '<p class="text-ovos-muted col-span-3 text-center py-8">No skills match your filters.</p>';
      document.getElementById('result-count').textContent = `${count} skill${count !== 1 ? 's' : ''}`;
    }

    }

    // =========================================================================

    async function renderIssues(el) {
      const [data, openFixIssues] = await Promise.all([
        fetchJSON('data/issues.json'),
        fetch(`https://api.github.com/repos/${LOCALIZE_REPO}/issues?state=open&labels=fix-lang-code&per_page=100`, {

      ]);
      const issues = data.issues || [];
      const byType = data.by_type || {};

      // Repos that already have an open fix-lang-code issue: repo -> issue URL
      const reposWithOpenFixIssue = new Map();
      for (const issue of openFixIssues) {
        const m = issue.title?.match(/\[fix-lang-code\]\s+(.+)/);

      const typeLabels = {

        'validation.entity.few_examples': 'entity.few_examples',

      const typeDescriptions = {

          impact: 'OVOS Localize normalises these automatically using a built-in mapping, so translations still work. However, the mapping may not always pick the right region, and the skill repo itself will be confusing to human translators.',

        },
        'validation.dialog.few_variants': {
          what: 'A <code class="mono text-yellow-400">.dialog</code> file has fewer than 2 response variants. OVOS picks a random variant each time it speaks, so more variants make the assistant feel less robotic and more natural.',
          impact: 'The voice assistant will repeat the exact same phrasing every time this dialog fires, which sounds monotonous to users.',

        'validation.intent.low_diversity': {
          what: 'The training phrases in an <code class="mono text-yellow-400">.intent</code> file are too similar to each other. Diversity in phrasing helps the intent recogniser generalise beyond the exact examples.',
          impact: 'The skill may only trigger for very narrow phrasings, missing synonyms or natural variations.',

        'validation.dialog.missing_variables': {
          what: 'A translated <code class="mono text-yellow-400">.dialog</code> file is missing one or more <code class="mono text-yellow-400">{variable}</code> placeholders that exist in the English source. OVOS fills these slots at runtime with dynamic values (e.g. <code class="mono text-yellow-400">{name}</code>, <code class="mono text-yellow-400">{time}</code>).',

          impact: 'The skill may crash at runtime when it tries to fill in a slot name that the skill code never provides.',

        'validation.regex.missing_named_groups': {
          what: 'A <code class="mono text-yellow-400">.rx</code> regex file is missing named capture groups (<code class="mono text-yellow-400">(?P&lt;name&gt;...)</code>). Named groups are how the skill extracts entities from matched utterances.',

        },
        'validation.value.missing_system_values': {
          what: 'A <code class="mono text-yellow-400">.value</code> file is missing entries for system-defined values that exist in the English source.',

          action: 'Add the missing value mappings in the translated file, matching the system value keys from the English source.',
        },
        'validation.value.parse_error': {
          what: 'A <code class="mono text-yellow-400">.value</code> file could not be parsed. The file may be malformed (wrong number of columns, encoding issues, etc.).',
          impact: 'The entire value file is unusable, causing the skill to fall back to English for all values it defines.',

        _default: {
          what: 'A potential problem was detected in this skill repository during the last data sync.',
          impact: 'The exact impact depends on the issue type. Translation quality or coverage may be affected.',
          action: 'Click the skill link to open the translation editor, or click the repo link to inspect it on GitHub.',
        },
      };

      const allTypes = Object.keys(byType);
      const repoTypes = allTypes.filter(t => !t.startsWith('validation.'));
      const validationTypes = allTypes.filter(t => t.startsWith('validation.')).sort((a, b) => (byType[b] || 0) - (byType[a] || 0));

      const repoIssues = issues.filter(i => !i.type.startsWith('validation.'));
      const validationIssues = issues.filter(i => i.type.startsWith('validation.'));

      function buildCallout(type) {
        const desc = typeDescriptions[type] || typeDescriptions._default;
        return `<div class="callout callout-warn text-sm space-y-2">
          <p><strong class="text-ovos-text">What is this?</strong> <span class="text-ovos-muted">${desc.what}</span></p>
          <p><strong class="text-ovos-text">Impact</strong> <span class="text-ovos-muted">${desc.impact}</span></p>
          <p><strong class="text-ovos-text">How to help</strong> <span class="text-ovos-muted">${desc.action}</span></p>
        </div>`;
      }

      function buildRepoTable(filtered) {
        if (!filtered.length) return `<p class="text-ovos-muted text-sm py-8 text-center">No issues.</p>`;

        // Group bad_lang_code issues by repo so one button fires one issue per repo
        const byRepo = {};
        for (const issue of filtered) {
          if (!byRepo[issue.repo]) byRepo[issue.repo] = { repo: issue.repo, skill_id: issue.skill_id, branch: issue.branch || 'dev', renames: [] };
          if (issue.code && issue.normalized) {
            const ldir = issue.locale_dir || 'locale';
            byRepo[issue.repo].renames.push({ from: `${ldir}/${issue.code}`, to: `${ldir}/${issue.normalized}` });
          }
        }

        function makeAutoFixUrl(entry) {
          const [org, repo] = entry.repo.split('/');
          const renameLines = entry.renames.map((r, i) => `rename_${i}: ${r.from} -> ${r.to}`).join('\n');
          const meta = `<!-- FIX_LANG_CODE_META\norg: ${org}\nrepo: ${repo}\nbranch: ${entry.branch || 'dev'}\n${renameLines}\n-->`;
          const title = encodeURIComponent(`[fix-lang-code] ${entry.repo}`);
          const body = encodeURIComponent(`${meta}\n\nAutomated locale directory rename request from OVOS Localize.\n\nRenames:\n${entry.renames.map(r => `- \`${r.from}\` → \`${r.to}\``).join('\n')}`);
          return `https://github.com/${LOCALIZE_REPO}/issues/new?title=${title}&body=${body}&labels=fix-lang-code`;
        }

        const rows = Object.values(byRepo).map(entry => {
          const existingIssueUrl = reposWithOpenFixIssue.get(entry.repo);
          const renameList = entry.renames.map(r =>
            `<div class="font-mono text-xs text-ovos-muted">${escapeHtml(r.from)} → ${escapeHtml(r.to)}</div>`

      function buildValidationTable(filtered) {

        // Attach a global handler; data-* attributes carry the needed values

            const ruleName = btn.dataset.rule;       // e.g. "dialog.few_variants"
            const ruleType = btn.dataset.type;       // e.g. "validation.dialog.few_variants"
            const ruleLabel = typeLabels[ruleType] || ruleName;
            const severity  = btn.dataset.severity;

            const skillData = await fetchSkill(skillId);
            const EDITOR_BASE = 'https://openvoiceos.github.io/ovos-localize/#/skill';

            // Collect every (file, lang) pair that has this rule violation
            const findings = [];
            for (const [fileKey, fileData] of Object.entries(skillData.files || {})) {
              for (const [lang, langData] of Object.entries(fileData.langs || {})) {
                const matches = (langData.validation || []).filter(v => v.rule_name === ruleName);
                if (!matches.length) continue;
                const filePath = langData.file_path || fileKey;
                for (const v of matches) {
                  findings.push({ fileKey, filePath, lang, message: v.message, line: v.line_number });
                }
              }
            }

            const uniqueLangs = [...new Set(findings.map(f => f.lang))].sort();
            const issuesUrl = `https://openvoiceos.github.io/ovos-localize/#/issues`;
            const title = encodeURIComponent(`[translation-quality] ${ruleLabel} in ${skillId}`);

            // Build rows, but keep URL under GitHub's ~8 000-char limit.
            // Prioritise rows with a line number (most actionable), then sort by lang.
            const sorted = [...findings].sort((a, b) => (b.line ? 1 : 0) - (a.line ? 1 : 0) || a.lang.localeCompare(b.lang));
            const makeRow = f => {
              const lineRef = f.line ? ` line ${f.line}` : '';
              const editorUrl = `${EDITOR_BASE}/${encodeURIComponent(skillId)}/${encodeURIComponent(f.fileKey)}/${encodeURIComponent(f.lang)}`;
              return `| \`${f.lang}\` | \`${f.filePath}\`${lineRef} | ${f.message} | [edit](${editorUrl}) |`;
            };

            const header =
              `## Translation quality: \`${ruleLabel}\`\n\n` +
              `**Skill**: \`${skillId}\` · **Severity**: ${severity} · **Occurrences**: ${findings.length}\n` +
              `**Languages**: ${uniqueLangs.join(', ')}\n\n` +
              `### Affected files\n\n` +
              `| Language | File | Message | |\n` +
              `|----------|------|---------|---|\n`;
            const footer =
              `\n---\n` +
              `Detected by [OVOS Localize](${issuesUrl}). ` +
              `Fix translations in the editor links above — no coding required.`;

            // Add rows until we'd exceed 7 500 encoded chars (leaving room for title + overhead)
            const MAX = 7500;
            let tableRows = '';
            let truncated = 0;
            for (const f of sorted) {
              const row = makeRow(f) + '\n';
              if (encodeURIComponent(header + tableRows + row + footer).length > MAX) { truncated++; continue; }
              tableRows += row;
            }
            const truncNote = truncated ? `\n_${truncated} more occurrence${truncated > 1 ? 's' : ''} not shown — see [OVOS Localize](${issuesUrl}) for the full list._` : '';
            const body = encodeURIComponent(header + tableRows + truncNote + footer);
            window.open(`https://github.com/${repo}/issues/new?title=${title}&body=${body}`, '_blank');
          } catch(e) {
            toast('Failed to load skill data: ' + e.message, 'red');
          } finally {
            btn.disabled = false;
            btn.textContent = '↗ Report';
          }
        };

        const rows = filtered.map(issue => {
          const severityBadge = issue.severity === 'error'
            ? `<span class="badge badge-red">● error</span>`
            : `<span class="badge badge-amber">▲ warning</span>`;
          const typeLabel = typeLabels[issue.type] || issue.type;
          const ruleName = issue.type.replace(/^validation\./, '');
          return `<tr class="border-t border-ovos-card hover:bg-ovos-hover">
            <td class="py-2 px-3">${severityBadge}</td>
            <td class="py-2 px-3 font-mono text-xs text-ovos-muted">${escapeHtml(typeLabel)}</td>
            <td class="py-2 px-3"><a href="#/skill/${escapeHtml(issue.skill_id)}" class="text-ovos-accent hover:underline text-sm">${escapeHtml(issue.skill_id)}</a></td>
            <td class="py-2 px-3"><a href="https://github.com/${escapeHtml(issue.repo)}" target="_blank" rel="noopener" class="text-ovos-muted hover:text-ovos-text text-xs">${escapeHtml(issue.repo)} ↗</a></td>
            <td class="py-2 px-3 text-sm text-ovos-muted">${escapeHtml(issue.detail)}</td>
            <td class="py-2 px-3">
              <button onclick="window._openValidationReport(this)"
                data-skill-id="${escapeHtml(issue.skill_id)}"
                data-repo="${escapeHtml(issue.repo)}"
                data-rule="${escapeHtml(ruleName)}"
                data-type="${escapeHtml(issue.type)}"
                data-severity="${escapeHtml(issue.severity)}"
                class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg border border-ovos-card text-ovos-muted hover:text-ovos-text disabled:opacity-40">
                ↗ Report
              </button>
            </td>
          </tr>`;
        }).join('');
        return `<table class="w-full text-left text-sm">
          <thead><tr class="text-ovos-muted text-xs uppercase">
            <th class="py-2 px-3">Severity</th>
            <th class="py-2 px-3">Rule</th>
            <th class="py-2 px-3">Skill</th>
            <th class="py-2 px-3">Repo</th>
            <th class="py-2 px-3">Detail</th>
            <th class="py-2 px-3"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      const repoTypeOptions = repoTypes.map(t =>
        `<option value="${escapeHtml(t)}">${typeLabels[t] || t} (${byType[t]})</option>`
      ).join('');
      const validationTypeOptions = `<option value="all">All rules</option>` + validationTypes.map(t =>
        `<option value="${escapeHtml(t)}">${typeLabels[t] || t} (${byType[t]})</option>`
      ).join('');

      // Collect all languages that appear in validation issues, sorted
      const allValidationLangs = [...new Set(validationIssues.flatMap(i => i.langs || []))].sort();
      const userLang = getUserLangs()[0] || 'en-US';
      const defaultLang = allValidationLangs.includes(userLang) ? userLang : 'all';
      const langOptions = `<option value="all">All languages</option>` + allValidationLangs.map(l =>
        `<option value="${escapeHtml(l)}" ${l === defaultLang ? 'selected' : ''}>${escapeHtml(l)}</option>`
      ).join('');

      function showTab(name) {
        ['translation', 'developer'].forEach(t => {
          document.getElementById(`tab-panel-${t}`).style.display = t === name ? '' : 'none';
          const btn = document.getElementById(`tab-btn-${t}`);

            btn.classList.add('border-transparent', 'text-ovos-muted');

      el.innerHTML = `
        <div class="max-w-6xl mx-auto px-4 py-8">

          <!-- TAB BAR -->
          <div class="flex gap-0 border-b border-ovos-card mb-6">
            <button id="tab-btn-translation" onclick="showIssuesTab('translation')"
              class="px-5 py-2.5 text-sm font-semibold border-b-2 border-ovos-accent text-ovos-text -mb-px transition-colors">

            <button id="tab-btn-developer" onclick="showIssuesTab('developer')"

              <p class="text-ovos-muted text-sm">These issues are in the translated locale files and can be fixed directly in the translation editor — no coding required. Fixing them improves how natural and reliable OVOS sounds in your language. Select a rule below to learn what it means and how to help.</p>

            <div id="validation-callout" class="mb-4">${buildCallout('_default')}</div>

          <div id="tab-panel-developer" style="display:none">
            <div class="mb-4">

            <div class="mb-4">${buildCallout('bad_lang_code')}</div>
            <div class="bg-ovos-card rounded-xl border border-ovos-card overflow-hidden">

                <span class="text-sm font-semibold" id="repo-issue-count">${new Set(repoIssues.map(i => i.repo)).size} affected repo${new Set(repoIssues.map(i => i.repo)).size !== 1 ? 's' : ''}</span>
                ${repoTypes.length > 1 ? `<select id="repo-type-filter" class="bg-ovos-input border border-ovos-card text-sm rounded-lg px-2 py-1 text-ovos-text"><option value="all">All types</option>${repoTypeOptions}</select>` : ''}
              </div>

            </div>
          </div>

        </div>`;

      window.showIssuesTab = (name) => {
        ['translation', 'developer'].forEach(t => {
          document.getElementById(`tab-panel-${t}`).style.display = t === name ? '' : 'none';
          const btn = document.getElementById(`tab-btn-${t}`);
          if (t === name) {

        let filtered = validationIssues;

        if (lang !== 'all') filtered = filtered.filter(i => (i.langs || []).includes(lang));

        document.getElementById('validation-table').innerHTML = buildValidationTable(filtered);
        document.getElementById('validation-count').textContent = `${filtered.length} issue${filtered.length !== 1 ? 's' : ''}`;
        document.getElementById('validation-callout').innerHTML = buildCallout(type === 'all' ? '_default' : type);

        // Rebuild language dropdown: only show langs that exist for the selected type
        const byType = type === 'all' ? validationIssues : validationIssues.filter(i => i.type === type);
        const availLangs = [...new Set(byType.flatMap(i => i.langs || []))].sort();

        // Rebuild type dropdown: only show types that exist for the selected lang
        const byLang = lang === 'all' ? validationIssues : validationIssues.filter(i => (i.langs || []).includes(lang));
        const availTypes = [...new Set(byLang.map(i => i.type))].sort();
        const curType = availTypes.includes(type) ? type : 'all';
        typeSel.innerHTML = `<option value="all">All rules</option>` +

          }).join('');
      }
      document.getElementById('validation-type-filter').addEventListener('change', applyValidationFilters);
      document.getElementById('validation-lang-filter').addEventListener('change', applyValidationFilters);
    }

      const meta = coverage.lang_meta || {};
      const userLangs = getUserLangs();

      // Use all coverage languages (not just ones with entity data) so users can create new files
      const allLangs = coverage.languages || [];
      const displayLangs = userLangs.length ? allLangs.filter(l => userLangs.includes(l)) : allLangs;

      const withFile = entityDb.filter(e => e.has_entity_file).length;
      const gaps = entityDb.filter(e => !e.has_entity_file).length;
      const totalSamples = entityDb.reduce((s, e) => s + Object.values(e.langs).reduce((s2, l) => s2 + (l.count||0), 0), 0);

      el.innerHTML = `
        <div class="max-w-6xl mx-auto">
          <div class="mb-6">
            <a href="#/" class="text-sm text-ovos-muted">&larr; Home</a>
            <h1 class="text-xl font-bold mt-2">Entity Database</h1>
            <p class="text-sm text-ovos-muted mt-1">Training data for Named Entity Recognition. Shows all <code>{entity}</code> slots used in .intent files and whether they have a corresponding .entity training file.</p>
          </div>

          <div class="callout mb-6 text-sm">
            <strong>What are entities?</strong> When a user says <em>"what's the weather in <span class="slot">{location}</span>"</em>, the word after "in" needs to be recognized as a location.

            <br><strong class="text-red-400">Gaps</strong> are {slots} used in .intent files that have <em>no</em> .entity training data — the assistant can't learn what values to expect.
          </div>

          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold text-green-400">${withFile}</div>
              <div class="text-xs text-ovos-muted">with .entity file</div>
            </div>
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold text-red-400">${gaps}</div>
              <div class="text-xs text-ovos-muted">missing .entity file</div>
            </div>
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold">${totalSamples.toLocaleString()}</div>
              <div class="text-xs text-ovos-muted">total samples</div>
            </div>

          <div class="flex gap-3 mb-4 items-center">

              <option value="">All entities</option>
              <option value="gap">Missing .entity file only</option>
              <option value="has">With .entity file only</option>
            </select>
            <span id="entity-count" class="text-xs text-ovos-muted"></span>
          </div>

          <div id="entity-list" class="space-y-3"></div>
        </div>`;

      window._entityDb = entityDb;
      window._entityDisplayLangs = displayLangs;
      window._entityMeta = meta;
      filterEntities();

    function filterEntities() {
      const db = window._entityDb || [];
      const displayLangs = window._entityDisplayLangs || [];
      const meta = window._entityMeta || {};
      const search = (document.getElementById('entity-search')?.value || '').toLowerCase();
      const typeFilter = document.getElementById('entity-type-filter')?.value || '';
      const list = document.getElementById('entity-list');
      const countEl = document.getElementById('entity-count');

      let filtered = db;
      if (search) filtered = filtered.filter(e => e.name.toLowerCase().includes(search) || e.skill.toLowerCase().includes(search));
      if (typeFilter === 'gap') filtered = filtered.filter(e => !e.has_entity_file);
      if (typeFilter === 'has') filtered = filtered.filter(e => e.has_entity_file);

      if (countEl) countEl.textContent = `${filtered.length} entities`;

      list.innerHTML = filtered.map(entity => {
        const enData = entity.langs['en-US'];
        const enSamples = enData?.samples || [];
        const enCount = enData?.count || 0;

        const entityFileName = entity.name + '.entity';

        if (!entity.has_entity_file) {
          // GAP — slot used in intents but no .entity file
          // Build GitHub "new file" URL by guessing locale path from the repo
          const [gapOrg, gapRepo] = entity.repo.split('/');
          return `
            <div class="bg-ovos-card rounded-xl p-4" style="border-left:3px solid #ef4444">
              <div class="flex items-start justify-between mb-1">
                <div class="flex items-center gap-2">
                  <span class="slot text-base">{${escapeHtml(entity.name)}}</span>
                  <span class="badge badge-red">no .entity file</span>
                </div>
                <div class="text-xs text-ovos-muted">from <a href="#/skill/${entity.skill}/en-US">${entity.skill.replace('ovos-skill-','').replace('ovos-','')}</a></div>
              </div>
              <div class="text-xs text-ovos-muted">
                Used in: ${entity.used_in_intents.map(i => `<span class="mono">${escapeHtml(i)}</span>`).join(', ')}
              </div>
              <div class="text-xs text-ovos-muted mt-1 mb-2">
                No training data exists. Click a language below to create <code>${escapeHtml(entityFileName)}</code> on GitHub — add example values, one per line.
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${displayLangs.map(lang => {
                  const href = `#/skill/${entity.skill}/${encodeURIComponent(entityFileName)}/${lang}`;
                  return `<a href="${href}" class="badge badge-gray hover:no-underline hover:opacity-80" title="Create ${entityFileName} for ${(meta[lang]?.native||lang)}">${lang} <span class="font-normal">+ create</span></a>`;
                }).join('')}
              </div>
            </div>`;
        }

        // HAS entity file — show ALL user languages (including missing ones)
        return `
          <div class="bg-ovos-card rounded-xl p-4">
            <div class="flex items-start justify-between mb-2">
              <div>
                <div class="flex items-center gap-2">
                  <span class="slot text-base">{${escapeHtml(entity.name)}}</span>
                  <span class="badge badge-green">.entity</span>
                </div>
                <div class="text-xs text-ovos-muted">from <a href="#/skill/${entity.skill}/en-US">${entity.skill.replace('ovos-skill-','').replace('ovos-','')}</a>
                  ${entity.used_in_intents.length ? ` &middot; used in: ${entity.used_in_intents.map(i => `<span class="mono">${escapeHtml(i)}</span>`).join(', ')}` : ''}
                </div>
              </div>
              <div class="text-right text-xs text-ovos-muted">${enCount} English samples</div>
            </div>
            ${enSamples.length ? `<div class="mb-3 text-xs">
              <span class="text-ovos-muted">Examples:</span>
              ${enSamples.map(s => `<span class="inline-block bg-ovos-bg px-1.5 py-0.5 rounded mr-1 mb-1 mono">${escapeHtml(s)}</span>`).join('')}
              ${enCount > 15 ? `<span class="text-ovos-muted">+${enCount - 15} more</span>` : ''}
            </div>` : ''}
            <div class="flex flex-wrap gap-1.5">
              ${displayLangs.map(lang => {
                const ld = entity.langs[lang];
                const count = ld?.count || 0;
                const target = Math.max(enCount, 5);
                const hasData = count > 0;
                const cls = !hasData ? 'badge-gray' : count >= target ? 'badge-green' : count >= target * 0.5 ? 'badge-amber' : 'badge-red';
                const label = hasData ? count : 'add';
                const href = `#/skill/${entity.skill}/${encodeURIComponent(entity.file_key)}/${lang}`;
                return `<a href="${href}" class="badge ${cls} hover:no-underline hover:opacity-80" title="${(meta[lang]?.native||lang)}: ${hasData ? count + ' samples' : 'no samples yet — click to add'}">${lang} <span class="font-normal">${label}</span></a>`;
              }).join('')}
            </div>
          </div>`;
      }).join('') || '<p class="text-ovos-muted text-center py-8">No entities match.</p>';
    }

        if (fileType !== 'entity') return [];

          .filter(([k, f]) => slotBearingTypes.has(f.type));
        const direct = candidateEntries
          .filter(([k, f]) => Object.values(f.langs || {}).some(ld => (ld.entries || []).some(e => pattern.test(e.text))))
          .map(([k, f]) => {
            const srcLd = f.langs?.[lang] || f.langs?.['en-US'] || Object.values(f.langs || {})[0];
            const displayLang = f.langs?.[lang] ? lang : (f.langs?.['en-US'] ? 'en-US' : Object.keys(f.langs || {})[0]);
            return { key: k, entries: (srcLd?.entries || []).filter(e => pattern.test(e.text)).slice(0, 6), displayLang, fallback: false };

                      } else {
                        // Single field: input
                        const tgtText = tgtItems.length ? tgtItems[0].text : '';
                        const srcText = srcItems[0]?.text || '';
                        const isLong = srcText.length > 80;
                        if (isLong) {
                          return '<div class="p-2 bg-ovos-bg rounded-lg"><label class="text-xs font-bold text-ovos-accent">' + escapeHtml(key) + '</label><div class="text-xs text-ovos-muted mt-0.5 mb-1">English: ' + escapeHtml(srcText.substring(0,120)) + (srcText.length > 120 ? '...' : '') + '</div><textarea class="json-field w-full bg-ovos-input text-ovos-text p-2 rounded border border-ovos-card text-sm" rows="3" data-key="' + escapeHtml(key) + '" spellcheck="true">' + escapeHtml(tgtText) + '</textarea></div>';

                      }

                </div>
                <!-- Hidden textarea that holds the actual JSON for submission -->
                <textarea id="translation-editor" class="hidden">${escapeHtml(currentText)}</textarea>
              ` : `
                <textarea id="translation-editor"
                  class="flex-1 w-full bg-ovos-input text-ovos-text p-3 rounded-lg border border-ovos-card text-sm resize-none leading-relaxed mono"
                  placeholder="${hasEntityContext ? `Example values that {${fileKey.replace('.entity','')}} can be replaced with, one per line.&#10;&#10;Example:&#10;value one&#10;value two&#10;value three` : isNew ? 'Type your translation here, one line per entry...&#10;&#10;Look at the source on the left for reference.&#10;Keep {variables} exactly as they are.' : 'Edit the translation...'}"
                  spellcheck="true"
                >${escapeHtml(currentText)}</textarea>
              `}

              <div class="mt-2 text-xs text-ovos-muted flex items-center gap-3 flex-shrink-0">
                <span id="line-count">0 lines</span>
                <span id="char-count">0 chars</span>
                ${srcData?.entries?.length ? `<span>(source: ${srcData.entries.length} lines)</span>` : ''}
              </div>
            </div>

            ${hasExpansion ? `
            <!-- Expansion preview — always visible for .intent, toggleable for others -->
            <div id="expansion-preview" class="bg-ovos-card rounded-xl p-3 overflow-hidden flex flex-col" style="min-height:8rem;max-height:40%">
              <div class="flex items-center gap-2 mb-2 flex-shrink-0">
                <h3 class="text-sm font-bold">Expanded sentences</h3>
                <span class="text-xs text-ovos-muted">— what the voice assistant actually matches</span>
                <span id="expansion-count" class="ml-auto badge badge-gray">0</span>
              </div>
              <div id="expansion-list" class="overflow-auto flex-1 text-xs mono leading-relaxed space-y-0.5"></div>
            </div>` : ''}

            ${isJsonFile ? `
            <!-- JSON preview panel -->
            <div class="bg-ovos-card rounded-xl p-3 overflow-auto" style="max-height:35%">
              <div class="flex items-center gap-2 mb-2">
                <h3 class="text-sm font-bold">JSON preview</h3>
                <span id="json-status" class="text-xs"></span>
              </div>
              <pre id="json-preview" class="text-xs mono"></pre>
            </div>` : ''}
          </div>

        </div>`;

      // Store context data for modal access
      window._editorCtx = ctx;
      window._editorFileHelp = fileHelp;
      window._editorFileData = fileData;

      // Wire up editor
      const editor = document.getElementById('translation-editor');
      editor.dataset.org = org;
      editor.dataset.repo = repo;
      editor.dataset.filePath = newFilePath || filePath;
      editor.dataset.lang = lang;
      editor.dataset.fileKey = fileKey;
      editor.dataset.skillId = skillId;
      editor.dataset.branch = skill.branch || 'dev';
      editor.dataset.srcLang = srcLang;
      editor.dataset.originalText = currentText;

      // Track file type for preview logic
      editor.dataset.fileType = fileType;
      editor.dataset.isJson = isJsonFile ? '1' : '';
      editor.dataset.hasExpansion = hasExpansion ? '1' : '';

      // For JSON form: sync form fields → hidden textarea
      if (isJsonFile) {
        const srcEntries = srcData?.entries || [];
        function syncJsonForm() {
          // Rebuild valid JSON from form fields + non-translatable source entries
          const obj = {};
          // Non-translatable entries from source
          for (const e of srcEntries) {
            if (e.translatable === false && e.key) {
              if (e.index != null) {
                if (!obj[e.key]) obj[e.key] = [];
                obj[e.key].push(e.text);
              } else {
                obj[e.key] = e.text;
              }
            }
          }
          // Translatable entries from form
          document.querySelectorAll('.json-field').forEach(field => {
            const key = field.dataset.key;
            if (!key) return;
            if (field.dataset.list) {
              obj[key] = field.value.split('\n').filter(l => l.trim());
            } else {
              obj[key] = field.value;
            }
          });
          editor.value = JSON.stringify(obj, null, 2);
          editor.dispatchEvent(new Event('input'));
        }
        document.querySelectorAll('.json-field').forEach(field => {
          field.addEventListener('input', syncJsonForm);
        });
        // Initial sync
        syncJsonForm();
      }

      function updateCounts() {
        const text = editor.value;
        const lines = text ? text.split('\n').filter(l => l.trim()).length : 0;
        document.getElementById('line-count').textContent = `${lines} line${lines!==1?'s':''}`;
        document.getElementById('char-count').textContent = `${text.length} chars`;

          status.innerHTML = '<span class="badge badge-amber">unsaved changes</span>';

          status.textContent = '';

        // Update JSON preview if applicable
        if (editor.dataset.isJson) updateJsonPreview();

        // Update expansion preview
        if (editor.dataset.hasExpansion) updateExpansionPreview(text);
      }
      editor.addEventListener('input', updateCounts);
      updateCounts();

      // Populate source expansion preview (one-time, static)
      if (hasEntityContext && entityContextIntents.length) {
        // Expand all intent sentences that contain this slot
        const allEntries = entityContextIntents.flatMap(i => i.entries).map(e => e.text);
