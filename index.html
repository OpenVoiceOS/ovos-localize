<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVOS Localize — Help translate OpenVoiceOS skills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ovos: { bg: '#0a0a0a', card: '#171717', accent: '#ef4444', text: '#e5e5e5', muted: '#737373', input: '#262626', hover: '#1f1f1f' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #ef4444; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace; }
    .slot { color: #fbbf24; font-weight: 600; font-family: ui-monospace, monospace; }
    .badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: #166534; color: #86efac; }
    .badge-amber { background: #713f12; color: #fde047; }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #450a0a; color: #fca5a5; }
    .badge-gray { background: #262626; color: #a3a3a3; }
    textarea { tab-size: 4; }
    textarea:focus { outline: 2px solid #ef4444; outline-offset: -1px; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 50;
      padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-size: 0.875rem;
      animation: slideUp 0.25s ease-out; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; } }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #525252;
      border-top-color: #ef4444; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: flex; align-items: center; justify-content: center; }
    .modal { background: #171717; border: 1px solid #262626; border-radius: 0.75rem; padding: 1.5rem; max-width: 32rem; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    /* Tooltip */
    [data-tip] { position: relative; cursor: help; }
    [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #0a0a0a; border: 1px solid #262626; color: #e5e5e5; padding: 0.375rem 0.625rem;
      border-radius: 0.375rem; font-size: 0.75rem; white-space: nowrap; z-index: 30; max-width: 20rem;
      white-space: normal; text-align: center; pointer-events: none;
    }
    /* Info callout */
    .callout { background: #171717; border-left: 3px solid #ef4444; padding: 0.75rem 1rem; border-radius: 0 0.375rem 0.375rem 0; }
    .callout-warn { border-left-color: #f59e0b; }
    /* Progress bar */
    .progress-bar { height: 0.375rem; border-radius: 9999px; background: #334155; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
    /* Hover cards */
    .skill-card { transition: transform 0.15s, box-shadow 0.15s; }
    .skill-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    /* Search */
    .search-box { background: #171717; border: 1px solid #262626; border-radius: 0.5rem; }
    .search-box:focus-within { border-color: #ef4444; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ===== HEADER ===== -->
  <header class="border-b border-ovos-card px-6 py-3 flex items-center gap-4 sticky top-0 bg-ovos-bg z-20">
    <a href="#/" class="flex items-center gap-2 hover:no-underline">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="text-lg font-bold text-ovos-accent">OVOS Localize</span>
    </a>
    <nav class="hidden sm:flex gap-4 ml-4 text-sm">
      <a href="#/" class="text-ovos-muted hover:text-ovos-text">Dashboard</a>
      <a href="#/stats" class="text-ovos-muted hover:text-ovos-text">Stats</a>
      <a href="#/how-it-works" class="text-ovos-muted hover:text-ovos-text">How it works</a>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="showOnboarding()" id="profile-btn" class="text-sm px-3 py-1.5 rounded-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-2" title="Your languages">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Set languages
      </button>
      <button onclick="showAuthModal()" id="auth-btn" class="text-sm px-3 py-1.5 rounded-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        Sign in
      </button>
    </div>
  </header>

  <main id="app" class="mx-auto px-4 sm:px-6 py-6"></main>
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <script>
    // =========================================================================
    // AUTH
    // =========================================================================
    const GH_API = 'https://api.github.com';
    function getToken() { return localStorage.getItem('ovos_gh_token'); }
    function setToken(t) { localStorage.setItem('ovos_gh_token', t); updateAuthUI(); }
    function clearToken() { localStorage.removeItem('ovos_gh_token'); localStorage.removeItem('ovos_gh_user'); updateAuthUI(); }
    function getUser() { const u = localStorage.getItem('ovos_gh_user'); return u ? JSON.parse(u) : null; }

    async function updateAuthUI() {
      const btn = document.getElementById('auth-btn');
      const token = getToken();
      if (!token) {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>Connect GitHub`;
        btn.onclick = showAuthModal;
        btn.className = 'text-sm px-3 py-1.5 rounded-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-2';
        return;
      }
      // Try cached user first to avoid API call on every page load
      const cached = getUser();
      if (cached) {
        btn.innerHTML = `<img src="${cached.avatar}" class="w-5 h-5 rounded-full"> ${cached.login}`;
        btn.className = 'text-sm px-3 py-1.5 rounded-lg bg-ovos-card flex items-center gap-2';
        btn.onclick = showAccountMenu;
      }
      // Validate in background
      try {
        const r = await ghFetch('/user');
        if (r.login) {
          localStorage.setItem('ovos_gh_user', JSON.stringify({ login: r.login, avatar: r.avatar_url }));
          btn.innerHTML = `<img src="${r.avatar_url}" class="w-5 h-5 rounded-full"> ${r.login}`;
          btn.onclick = showAccountMenu;
        }
      } catch {
        btn.innerHTML = 'Token expired — reconnect';
        btn.className = 'text-sm px-3 py-1.5 rounded-lg border border-red-500 text-red-400 hover:bg-ovos-hover flex items-center gap-2';
        btn.onclick = showAuthModal;
      }
    }

    function showAccountMenu() {
      const user = getUser();
      if (!user) return;
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:20rem">
            <div class="flex items-center gap-3 mb-4">
              <img src="${user.avatar}" class="w-10 h-10 rounded-full">
              <div>
                <div class="font-bold">${escapeHtml(user.login)}</div>
                <div class="text-xs text-ovos-muted">Connected to GitHub</div>
              </div>
            </div>
            <button onclick="clearToken();closeModal();route()" class="w-full px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover text-left">
              Disconnect
            </button>
          </div>
        </div>`;
    }

    async function ghFetch(path, opts = {}) {
      const token = getToken();
      if (!token) throw new Error('Not authenticated — sign in first');
      const url = path.startsWith('http') ? path : GH_API + path;
      const r = await fetch(url, {
        ...opts,
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.message || `GitHub API ${r.status}`); }
      return r.status === 204 ? {} : r.json();
    }

    const GH_TOKEN_URL = 'https://github.com/settings/personal-access-tokens/new';

    function showAuthModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:28rem">

            <div class="text-center mb-5">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
              <h3 class="text-lg font-bold">Connect your GitHub account</h3>
              <p class="text-sm text-ovos-muted mt-1">This lets you submit translations as pull requests directly from this page.</p>
            </div>

            <!-- Step indicator -->
            <div id="auth-step-1">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-7 h-7 rounded-full bg-ovos-accent text-white flex items-center justify-center text-sm font-bold flex-shrink-0">1</div>
                <div class="text-sm">Create a GitHub access token <span class="text-ovos-muted">(one-time setup)</span></div>
              </div>

              <a href="${GH_TOKEN_URL}" target="_blank" onclick="document.getElementById('auth-step-1').classList.add('hidden');document.getElementById('auth-step-2').classList.remove('hidden');setTimeout(()=>document.getElementById('token-input')?.focus(),200)"
                class="block w-full text-center px-4 py-3 bg-ovos-card rounded-xl hover:bg-ovos-hover hover:no-underline text-sm border border-ovos-card mb-3">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inline mr-2 -mt-0.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                Open GitHub &rarr; Create token
              </a>

              <div class="text-xs text-ovos-muted space-y-1">
                <p>On the GitHub page that opens:</p>
                <ol class="list-decimal ml-4 space-y-0.5">
                  <li>Give it a name like <strong>"OVOS Localize"</strong></li>
                  <li>Set expiration (90 days is fine)</li>
                  <li>Under <strong>Repository access</strong>, select <strong>"Only select repositories"</strong> and pick <strong>ovos-localize</strong></li>
                  <li>Under <strong>Permissions → Actions</strong>, set to <strong>Read and write</strong></li>
                  <li>Click <strong>"Generate token"</strong></li>
                  <li>Copy the token that starts with <code class="text-ovos-accent">github_pat_</code></li>
                </ol>
              </div>

              <div class="mt-4 text-center">
                <button onclick="document.getElementById('auth-step-1').classList.add('hidden');document.getElementById('auth-step-2').classList.remove('hidden');setTimeout(()=>document.getElementById('token-input')?.focus(),100)"
                  class="text-sm text-ovos-muted hover:text-ovos-text">I already have a token &rarr;</button>
              </div>
            </div>

            <div id="auth-step-2" class="hidden">
              <div class="flex items-center gap-3 mb-4">
                <div class="w-7 h-7 rounded-full bg-ovos-accent text-white flex items-center justify-center text-sm font-bold flex-shrink-0">2</div>
                <div class="text-sm">Paste your token below</div>
              </div>

              <div class="relative mb-3">
                <input id="token-input" type="password" placeholder="github_pat_... or ghp_..."
                  class="w-full bg-ovos-input text-ovos-text px-3 py-3 rounded-xl border border-ovos-card text-sm mono pr-20"
                  onkeydown="if(event.key==='Enter')submitToken()"
                  oninput="document.getElementById('auth-submit').disabled=!this.value.trim()">
                <button onclick="const i=document.getElementById('token-input');i.type=i.type==='password'?'text':'password'" class="absolute right-2 top-2.5 text-xs text-ovos-muted hover:text-ovos-text px-2 py-1 rounded">show</button>
              </div>

              <button id="auth-submit" onclick="submitToken()" disabled class="w-full px-4 py-2.5 text-sm rounded-xl bg-ovos-accent text-white font-bold hover:opacity-80 disabled:opacity-40 mb-3">
                Connect
              </button>

              <div id="auth-error" class="hidden text-sm text-red-400 text-center mb-3"></div>

              <div class="text-xs text-ovos-muted text-center space-y-1">
                <p>Your token is stored only in this browser's local storage.</p>
                <p>It is sent only to <code>api.github.com</code> — never to any other server.</p>
              </div>

              <div class="mt-3 text-center">
                <button onclick="document.getElementById('auth-step-2').classList.add('hidden');document.getElementById('auth-step-1').classList.remove('hidden')"
                  class="text-sm text-ovos-muted hover:text-ovos-text">&larr; Back to step 1</button>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-ovos-card text-center">
              <button onclick="closeModal()" class="text-sm text-ovos-muted hover:text-ovos-text">Cancel</button>
            </div>
          </div>
        </div>`;
    }
    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
    async function submitToken() {
      const input = document.getElementById('token-input');
      const token = input.value.trim();
      if (!token) return;

      const errEl = document.getElementById('auth-error');
      const btn = document.getElementById('auth-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verifying...';
      errEl.classList.add('hidden');

      // Verify the token works before saving
      try {
        const r = await fetch(GH_API + '/user', {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (!r.ok) throw new Error(r.status === 401 ? 'Invalid token — check that you copied it correctly' : `GitHub returned ${r.status}`);
        const user = await r.json();
        setToken(token);
        localStorage.setItem('ovos_gh_user', JSON.stringify({ login: user.login, avatar: user.avatar_url }));
        closeModal();
        toast(`Connected as ${user.login}!`, 'green');
        route();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }

    // =========================================================================
    // USER PROFILE (localStorage — languages, display name)
    // =========================================================================
    function getProfile() {
      const p = localStorage.getItem('ovos_profile');
      return p ? JSON.parse(p) : null;
    }
    function saveProfile(profile) {
      localStorage.setItem('ovos_profile', JSON.stringify(profile));
      updateProfileUI();
    }
    function getUserLangs() {
      const p = getProfile();
      return p?.languages || [];
    }
    function hasCompletedOnboarding() { return !!getProfile(); }

    function updateProfileUI() {
      const btn = document.getElementById('profile-btn');
      if (!btn) return;
      const p = getProfile();
      if (p) {
        const langCount = p.languages.length;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>${langCount} lang${langCount !== 1 ? 's' : ''}`;
        btn.title = `Your languages: ${p.languages.join(', ')}`;
      } else {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Set languages`;
      }
    }

    async function showOnboarding() {
      let langMeta = {};
      try {
        const coverage = await fetchJSON('data/coverage.json');
        langMeta = coverage.lang_meta || {};
      } catch {}

      // Build language list (exclude en-US)
      const allLangs = Object.keys(langMeta).filter(l => l !== 'en-US').sort((a, b) => {
        const na = langMeta[a]?.native || a;
        const nb = langMeta[b]?.native || b;
        return na.localeCompare(nb);
      });

      const existing = getProfile();
      const selectedSet = new Set(existing?.languages || []);

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:36rem">
            <div class="text-center mb-4">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <h2 class="text-xl font-bold">${existing ? 'Update your languages' : 'Welcome to OVOS Localize!'}</h2>
              <p class="text-sm text-ovos-muted mt-1">${existing ? 'Change which languages you see.' : 'What languages do you speak? We\'ll only show skills that need help in your languages.'}</p>
            </div>

            <div class="mb-3">
              <div class="search-box flex items-center px-3 py-2 gap-2 mb-3">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="lang-search" type="text" placeholder="Search languages..." class="bg-transparent text-sm text-ovos-text w-full outline-none placeholder-ovos-muted" oninput="filterOnboardingLangs()">
              </div>
              <div id="lang-grid" class="grid grid-cols-2 gap-1.5 max-h-64 overflow-auto pr-1">
                ${allLangs.map(code => {
                  const m = langMeta[code] || {};
                  const checked = selectedSet.has(code) ? 'checked' : '';
                  return `<label class="lang-option flex items-center gap-2 p-2 rounded-lg hover:bg-ovos-hover cursor-pointer text-sm" data-code="${code}" data-search="${(m.native||'').toLowerCase()} ${(m.display||'').toLowerCase()} ${code.toLowerCase()}">
                    <input type="checkbox" value="${code}" class="lang-cb accent-red-500 w-4 h-4" ${checked} onchange="updateOnboardingCount()">
                    <div>
                      <div class="font-medium">${escapeHtml(m.native || code)}</div>
                      <div class="text-xs text-ovos-muted">${escapeHtml(m.display || code)}</div>
                    </div>
                  </label>`;
                }).join('')}
              </div>
              <div class="mt-2 text-xs text-ovos-muted"><span id="onboarding-count">${selectedSet.size}</span> language${selectedSet.size !== 1 ? 's' : ''} selected</div>
            </div>

            <div class="flex gap-2 justify-end">
              ${existing ? '<button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover">Cancel</button>' : ''}
              <button onclick="saveOnboarding()" id="save-onboarding-btn" class="px-4 py-2 text-sm rounded-lg bg-ovos-accent text-ovos-bg font-bold hover:opacity-80 disabled:opacity-40" ${selectedSet.size === 0 && !existing ? 'disabled' : ''}>
                ${existing ? 'Save' : 'Get started'}
              </button>
            </div>
          </div>
        </div>`;
    }

    function filterOnboardingLangs() {
      const q = (document.getElementById('lang-search')?.value || '').toLowerCase();
      document.querySelectorAll('.lang-option').forEach(el => {
        el.style.display = el.dataset.search.includes(q) ? '' : 'none';
      });
    }

    function updateOnboardingCount() {
      const count = document.querySelectorAll('.lang-cb:checked').length;
      const el = document.getElementById('onboarding-count');
      if (el) el.textContent = count;
      const btn = document.getElementById('save-onboarding-btn');
      if (btn) btn.disabled = count === 0;
    }

    function saveOnboarding() {
      const selected = Array.from(document.querySelectorAll('.lang-cb:checked')).map(cb => cb.value);
      if (selected.length === 0) { toast('Select at least one language', 'amber'); return; }
      const isFirst = !hasCompletedOnboarding();
      saveProfile({ languages: selected, createdAt: new Date().toISOString() });
      closeModal();
      toast(`Showing ${selected.length} language${selected.length > 1 ? 's' : ''}`, 'green');
      if (isFirst) {
        location.hash = '#/dashboard';
      } else {
        route();
      }
    }

    // =========================================================================
    // PR SUBMISSION
    // =========================================================================
    // The repo that hosts the submit_translation.yml workflow
    const DISPATCH_REPO = 'OpenVoiceOS/ovos-localize';

    async function submitTranslation(org, repo, filePath, newContent, lang, fileKey, branch = 'dev') {
      if (!getToken()) { showAuthModal(); return; }
      const user = getUser();
      if (!user) { toast('Sign in first', 'red'); return; }

      showProgress('Submitting translation...');

      // Base64 encode the file content for safe transport through JSON
      const b64Content = btoa(unescape(encodeURIComponent(newContent)));

      // Trigger the GitHub Action via repository_dispatch
      await ghFetch(`/repos/${DISPATCH_REPO}/dispatches`, {
        method: 'POST',
        body: JSON.stringify({
          event_type: 'submit-translation',
          client_payload: {
            org,
            repo,
            file_path: filePath,
            content: b64Content,
            lang,
            file_key: fileKey,
            branch,
            author: user.login,
          },
        }),
      });

      hideProgress();
      toast('Translation submitted! A bot will open the PR shortly.', 'green', 6000);
    }

          langs: data.langs || data.languages || [],

    /** Strip region from BCP-47 for the translate API (e.g. pt-BR → pt, en-US → en) */
    function langToShort(code) {
      return code.split('-')[0].toLowerCase();
    }

    /**
     * Translate a single string via OVOS translate server.
     * GET /translate/{src}/{tgt}/{text}
     */
    async function ovsTranslate(text, srcLang, tgtLang, serverUrl) {
      const src = langToShort(srcLang);
      const tgt = langToShort(tgtLang);
      const url = `${serverUrl}/translate/${src}/${tgt}/${encodeURIComponent(text)}`;
      const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(`Translation server returned ${r.status}`);
      const data = await r.json().catch(() => r.text());
      return typeof data === 'string' ? data : (data.translation || data.translated || String(data));
    }

    /**
     * Auto-translate all lines from English source to target language.
     * Translates line-by-line to preserve structure.
     */
    async function autoTranslateLines(lines, tgtLang, serverUrl, onProgress) {
      const results = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith('#')) {
          results.push(line);
          continue;
        }
        // Preserve {slots} — replace with placeholders before translating
        const slots = [];
        const cleaned = line.replace(/\{(\w+)\}/g, (match) => {
          slots.push(match);
          return `__SLOT${slots.length - 1}__`;
        });
        // Preserve (a|b) alternatives — translate each option separately
        const altGroups = [];
        const withoutAlts = cleaned.replace(/\(([^)]+)\)/g, (match, group) => {
          altGroups.push(group);
          return `__ALT${altGroups.length - 1}__`;
        });

        let translated;
        try {
          translated = await ovsTranslate(withoutAlts, 'en-US', tgtLang, serverUrl);
        } catch {
          translated = withoutAlts; // Keep original on failure
        }

        // Restore alternatives (translate each option)
        for (let j = 0; j < altGroups.length; j++) {
          const options = altGroups[j].split('|');
          const translatedOpts = [];
          for (const opt of options) {
            if (!opt.trim()) { translatedOpts.push(''); continue; }
            try {
              translatedOpts.push(await ovsTranslate(opt.trim(), 'en-US', tgtLang, serverUrl));
            } catch {
              translatedOpts.push(opt);
            }
          }
          translated = translated.replace(`__ALT${j}__`, `(${translatedOpts.join('|')})`);
        }

        // Restore slots
        for (let j = 0; j < slots.length; j++) {
          translated = translated.replace(`__SLOT${j}__`, slots[j]);
        }

        results.push(translated);
        if (onProgress) onProgress(i + 1, lines.length);
      }
      return results;
    }

    // =========================================================================
    // TEMPLATE EXPANSION — port of ovos_utils.bracket_expansion.expand_template
    // =========================================================================
    function expandTemplate(template) {
      // [optional] → (optional|)
      let t = template.replace(/\[([^\[\]]+)\]/g, '($1|)');

      function expandAlternatives(text) {
        const parts = [];
        const segments = text.split(/(\([^()]+\))/);
        for (const seg of segments) {
          if (seg.startsWith('(') && seg.endsWith(')')) {
            parts.push(seg.slice(1, -1).split('|'));
          } else {
            parts.push([seg]);
          }
        }
        // Cartesian product
        return cartesian(parts).map(combo => combo.join('').replace(/\s+/g, ' ').trim());
      }

      function cartesian(arrays) {
        return arrays.reduce((acc, arr) => {
          const result = [];
          for (const a of acc) for (const b of arr) result.push([...a, b]);
          return result;
        }, [['']]);  // Start with array containing empty string, not empty array
      }

      // Iteratively expand until stable
      let result = new Set([t]);
      for (let i = 0; i < 10; i++) { // safety limit
        const expanded = new Set();
        for (const text of result) {
          for (const e of expandAlternatives(text)) expanded.add(e);
        }
        if (expanded.size === result.size && [...expanded].every(x => result.has(x))) break;
        result = expanded;
      }
      return [...result].filter(s => s.trim()).sort();
    }

    /** Expand all lines and return total count + sample */
    function expandAllLines(text, maxPerLine = 50, maxTotal = 200) {
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
      let total = 0;
      const samples = [];
      for (const line of lines) {
        const expanded = expandTemplate(line);
        total += expanded.length;
        // Keep some samples
        for (const e of expanded.slice(0, maxPerLine)) {
          if (samples.length < maxTotal) samples.push(e);
        }
      }
      return { total, samples, lineCount: lines.length };
    }

    function highlightJson(jsonStr) {

        .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span style="color:#86efac">$1</span>')  // string values in green
        .replace(/:\s*(true|false|null)/g, ': <span style="color:#fde047">$1</span>')     // booleans in yellow
        .replace(/:\s*(\d+(?:\.\d+)?)/g, ': <span style="color:#93c5fd">$1</span>');      // numbers in blue
    }

    function filterDashboard() {
      const { repos, coverage, langs, allLangs } = window._dashData;
      const search = (document.getElementById('skill-search')?.value || '').toLowerCase();
      const langFilterRaw = document.getElementById('lang-filter')?.value || '';
      const statusFilter = document.getElementById('status-filter')?.value || '';

      // Determine which languages to consider
      let langFilter = '';
      let displayLangsForCard;
      if (langFilterRaw === '__all__') {
        displayLangsForCard = allLangs;
      } else if (langFilterRaw) {
        langFilter = langFilterRaw;
        displayLangsForCard = [langFilterRaw];
      } else {
        displayLangsForCard = langs; // user's languages
      }
      const grid = document.getElementById('skill-grid');

      let filtered = repos;
      if (search) filtered = filtered.filter(r => r.id.includes(search) || (r.skill_class||'').toLowerCase().includes(search));

      let html = '';
      let count = 0;
      for (const repo of filtered) {
        const m = coverage.matrix[repo.id] || {};

        // Compute overall coverage for this skill
        let totalPct = 0, pctCount = 0;
        for (const l of displayLangsForCard) {
          if (m[l]?.combined_pct != null) { totalPct += m[l].combined_pct; pctCount++; }
        }
        const avgPct = pctCount > 0 ? totalPct / pctCount : 0;

        if (statusFilter === 'needs-work' && avgPct >= 50) continue;
        if (statusFilter === 'partial' && (avgPct < 50 || avgPct >= 80)) continue;
        if (statusFilter === 'good' && avgPct < 80) continue;

        // Find languages needing the most work
        const needsWork = [];
        for (const l of displayLangsForCard) {
          const pct = m[l]?.combined_pct;
          if (pct != null && pct < 80) needsWork.push({ lang: l, pct });
        }
        needsWork.sort((a, b) => a.pct - b.pct);

        count++;
        // Pick the best default language to link to
        const defaultLang = needsWork.length > 0 ? needsWork[0].lang : (displayLangsForCard[0] || 'en-US');

        html += `
          <div class="skill-card p-4 bg-ovos-card rounded-xl">
            <div class="flex items-start justify-between mb-2">
              <a href="#/skill/${repo.id}/${defaultLang}" class="hover:no-underline">
                <div class="font-bold text-ovos-text text-sm">${repo.id.replace('ovos-skill-', '')}</div>
                <div class="text-xs text-ovos-muted">${repo.skill_class || 'Unknown'}</div>
              </a>
              ${coverageBadge(avgPct > 0 ? avgPct : null)}
            </div>
            ${progressBar(avgPct)}
            <div class="mt-2 text-xs text-ovos-muted">${repo.languages.length} languages, ${repo.file_count} files</div>
            <div class="mt-2 flex flex-wrap gap-1">
              ${displayLangsForCard.map(l => {
                const pct = m[l]?.combined_pct;
                const cls = pct == null ? 'badge-gray' : pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-red';
                return `<a href="#/skill/${repo.id}/${l}" class="badge ${cls} hover:no-underline hover:opacity-80">${l} ${pct != null ? pct.toFixed(0)+'%' : 'new'}</a>`;
              }).join('')}
            </div>
          </div>`;
      }

      grid.innerHTML = html || '<p class="text-ovos-muted col-span-3 text-center py-8">No skills match your filters.</p>';
      document.getElementById('result-count').textContent = `${count} skill${count !== 1 ? 's' : ''}`;
    }

              const warns = ld?.validation?.filter(v => v.severity === 'warning').length || 0;
              const lineCount = ld?.line_count || 0;
              const enLineCount = enLd?.line_count || 0;
              const typeHelp = FILE_TYPE_HELP[fileData.type] || '';

              // Status badge
              let statusBadge;
              if (!exists) statusBadge = '<span class="badge badge-red">missing — click to add</span>';

              else if (warns > 0) statusBadge = `<span class="badge badge-amber">${warns} warning${warns>1?'s':''}</span>`;
              else statusBadge = '<span class="badge badge-green">ok</span>';

              // For skill.json, show key preview
              let preview = '';
              if (fileData.type === 'skill.json' && ld?.entries) {
                const nameEntry = ld.entries.find(e => e.key === 'name');
                const descEntry = ld.entries.find(e => e.key === 'description');
                if (nameEntry) preview += `<span class="text-ovos-text">${escapeHtml(nameEntry.text)}</span>`;
                if (descEntry) preview += ` — <span class="text-ovos-muted">${escapeHtml(descEntry.text.substring(0, 60))}${descEntry.text.length > 60 ? '...' : ''}</span>`;
              } else if (exists && ld.entries?.length) {
                preview = `<span class="text-ovos-muted mono text-xs">${escapeHtml(ld.entries[0].text.substring(0, 50))}${ld.entries[0].text.length > 50 ? '...' : ''}</span>`;
              }

              return `
              <a href="#/skill/${skillId}/${encodeURIComponent(fileKey)}/${encodeURIComponent(activeLang)}" class="block p-3 bg-ovos-card rounded-xl hover:bg-ovos-hover hover:no-underline">

                    <div class="flex items-center gap-2">
                      <span class="font-medium mono text-sm">${fileKey}</span>
                      <span class="badge badge-blue mono">.${fileData.type}</span>
                      ${statusBadge}
                    </div>
                    <div class="text-xs text-ovos-muted mt-0.5">${escapeHtml(typeHelp.substring(0, 80))}</div>
                    ${preview ? `<div class="mt-1 text-xs truncate">${preview}</div>` : ''}
                  </div>
                  <div class="text-right flex-shrink-0 text-xs text-ovos-muted">
                    ${exists ? `${lineCount} lines` : ''}
                    ${enLineCount ? `<br><span class="text-ovos-muted">en: ${enLineCount}</span>` : ''}
                  </div>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" class="flex-shrink-0"><path d="m9 18 6-6-6-6"/></svg>
                </div>
              </a>`;
            }).join('')}
          </div>
        </div>`;
    }

        if (enListEl) {
          enListEl.innerHTML = samples.map((s, i) =>
            `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
          ).join('') + (total > samples.length ? `<div class="text-ovos-muted mt-1">... and ${total - samples.length} more</div>` : '');
        }
      }
      editor.focus();

      // Check translation server status (background)
      if (!isJsonFile) updateTxStatusDot();
    }

    // --- Expansion preview ---
    let _previewDebounce = null;
    function updateExpansionPreview(text) {
      clearTimeout(_previewDebounce);
      _previewDebounce = setTimeout(() => {
        const { total, samples, lineCount } = expandAllLines(text, 30, 150);
        const countEl = document.getElementById('expansion-count');
        const listEl = document.getElementById('expansion-list');
        if (!countEl || !listEl) return;

        // Color the count based on how many expansions
        const cls = total >= 10 ? 'badge-green' : total >= 5 ? 'badge-amber' : 'badge-red';
        countEl.className = `badge ${cls} text-xs`;
        countEl.textContent = `${total} sentence${total !== 1 ? 's' : ''}`;

        if (!text.trim()) {
          listEl.innerHTML = '<p class="text-ovos-muted">Your translated lines will expand here as you type.<br>Use <span class="mono">(option1|option2)</span> for alternatives and <span class="mono">[optional]</span> for optional words.</p>';
        } else if (total === lineCount) {
          // No expansion needed (no alternatives)
          listEl.innerHTML = samples.map((s, i) =>
            `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
          ).join('') + '<div class="text-ovos-muted mt-2 text-xs">Tip: use <span class="mono">(word1|word2)</span> to add alternative phrasings.</div>';
        } else {
          listEl.innerHTML = `<div class="text-ovos-muted mb-1">${lineCount} template${lineCount>1?'s':''} → ${total} unique sentences</div>` +
            samples.map((s, i) =>
              `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
            ).join('') + (total > samples.length ? `<div class="text-ovos-muted mt-1">... and ${total - samples.length} more</div>` : '');
        }
      }, 250);
    }

    // --- JSON preview ---
    function updateJsonPreview(text) {
      const preview = document.getElementById('json-preview');
      const status = document.getElementById('json-status');
      if (!preview || !status) return;
      if (!text.trim()) {
        preview.innerHTML = '<span class="text-ovos-muted">Empty</span>';
        status.textContent = '';
        return;
      }
      try {
        const parsed = JSON.parse(text);
        const formatted = JSON.stringify(parsed, null, 2);
        preview.innerHTML = highlightJson(escapeHtml(formatted));
        status.innerHTML = '<span class="text-green-400">valid JSON</span>';
      } catch (e) {
        preview.innerHTML = `<span class="text-red-400">${escapeHtml(e.message)}</span>`;
        status.innerHTML = '<span class="text-red-400">invalid JSON</span>';
      }
    }

    async function handleAutoTranslate(tgtLang) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;

      // Get English source lines from the data
      const { skillId, fileKey } = editor.dataset;
      if (!skillId) { toast('Cannot determine skill', 'red'); return; }

      let enLines;
      try {
        const skill = await fetchJSON(`data/skills/${skillId}.json`);
        const fd = skill.files[fileKey];
        const enData = fd?.langs?.['en-US'];
        if (!enData?.entries?.length) { toast('No English source to translate from', 'red'); return; }
        enLines = enData.entries.map(e => e.text);
      } catch (e) {
        toast(`Failed to load source: ${e.message}`, 'red'); return;
      }

      const hasExisting = editor.value.trim().length > 0;
      if (hasExisting && !confirm('This will replace the current translation with an auto-translated version. Continue?')) return;

      const serverUrl = getTranslateServer();
      const btn = document.getElementById('auto-tx-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;

      try {
        const translated = await autoTranslateLines(enLines, tgtLang, serverUrl, (done, total) => {
          btn.innerHTML = `<span class="spinner"></span> ${done}/${total}`;
        });

        editor.value = translated.join('\n');
        editor.dispatchEvent(new Event('input'));
        toast(`Auto-translated ${translated.length} lines. Review and edit before submitting!`, 'green', 5000);
      } catch (e) {
        toast(`Translation failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    function insertSlot(name) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;
      const s = editor.selectionStart, e = editor.selectionEnd;
      const ins = `{${name}}`;
      editor.value = editor.value.substring(0, s) + ins + editor.value.substring(e);
      editor.selectionStart = editor.selectionEnd = s + ins.length;
      editor.focus();
      editor.dispatchEvent(new Event('input'));
    }

    async function handleSubmitPR() {
      if (!getToken()) { showAuthModal(); return; }
      const editor = document.getElementById('translation-editor');
      const newContent = editor.value;
      if (newContent === editor.dataset.originalText) { toast('No changes to submit', 'amber'); return; }
      if (!newContent.trim()) { toast('Translation is empty', 'red'); return; }
      const { org, repo, filePath, lang, fileKey } = editor.dataset;
      if (!filePath) { toast('Cannot determine file path — use "Edit on GitHub" instead', 'red'); return; }
      const lines = newContent.split('\n').filter(l => l.trim()).length;
      if (!confirm(`Submit ${lines} line(s) for "${fileKey}" (${lang})?\n\nA bot will open a pull request to ${org}/${repo} on your behalf.`)) return;
      const btn = document.getElementById('submit-pr-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Submitting...';
      try {
        const content = newContent.endsWith('\n') ? newContent : newContent + '\n';
        await submitTranslation(org, repo, filePath, content, lang, fileKey);
        editor.dataset.originalText = editor.value;
        document.getElementById('editor-status').innerHTML = '<span class="badge badge-green">submitted!</span>';
      } catch (e) {
        toast(`Failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit translation';
      }
    }
  </script>
</body>
</html>
