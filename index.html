<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVOS Localize — Help translate OpenVoiceOS skills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ovos: { bg: '#0a0a0a', card: '#171717', accent: '#ef4444', text: '#e5e5e5', muted: '#737373', input: '#262626', hover: '#1f1f1f' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #ef4444; }
    a:hover { text-decoration: underline; }
    code, .mono { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace; }
    .slot { color: #fbbf24; font-weight: 600; font-family: ui-monospace, monospace; }
    .badge { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-green { background: #166534; color: #86efac; }
    .badge-amber { background: #713f12; color: #fde047; }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #450a0a; color: #fca5a5; }
    .badge-gray { background: #262626; color: #a3a3a3; }
    textarea { tab-size: 4; }
    textarea:focus { outline: 2px solid #ef4444; outline-offset: -1px; }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 50;
      padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-size: 0.875rem;
      animation: slideUp 0.25s ease-out; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; } }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #525252;
      border-top-color: #ef4444; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: flex; align-items: center; justify-content: center; }
    .modal { background: #171717; border: 1px solid #262626; border-radius: 0.75rem; padding: 1.5rem; max-width: 32rem; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    /* Tooltip */
    [data-tip] { position: relative; cursor: help; }
    [data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #0a0a0a; border: 1px solid #262626; color: #e5e5e5; padding: 0.375rem 0.625rem;
      border-radius: 0.375rem; font-size: 0.75rem; white-space: nowrap; z-index: 30; max-width: 20rem;
      white-space: normal; text-align: center; pointer-events: none;
    }
    /* Info callout */
    .callout { background: #171717; border-left: 3px solid #ef4444; padding: 0.75rem 1rem; border-radius: 0 0.375rem 0.375rem 0; }
    .callout-warn { border-left-color: #f59e0b; }
    /* Progress bar */
    .progress-bar { height: 0.375rem; border-radius: 9999px; background: #334155; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
    /* Hover cards */
    .skill-card { transition: transform 0.15s, box-shadow 0.15s; }
    .skill-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    /* Search */
    .search-box { background: #171717; border: 1px solid #262626; border-radius: 0.5rem; }
    .search-box:focus-within { border-color: #ef4444; }
    /* README content styling */
    .readme-content { color: #e5e5e5; line-height: 1.6; }
    .readme-content h1, .readme-content h2, .readme-content h3 { font-weight: bold; margin: 1em 0 0.5em; border-bottom: 1px solid #262626; padding-bottom: 0.3em; }
    .readme-content h1 { font-size: 1.5em; }
    .readme-content h2 { font-size: 1.25em; }
    .readme-content h3 { font-size: 1.1em; border: none; }
    .readme-content p { margin: 0.5em 0; }
    .readme-content ul, .readme-content ol { margin: 0.5em 0; padding-left: 1.5em; }
    .readme-content li { margin: 0.25em 0; }
    .readme-content code { background: #262626; padding: 0.15em 0.4em; border-radius: 0.25em; font-size: 0.9em; }
    .readme-content pre { background: #171717; padding: 0.75em; border-radius: 0.5em; overflow-x: auto; margin: 0.5em 0; }
    .readme-content pre code { background: none; padding: 0; }
    .readme-content a { color: #ef4444; }
    .readme-content img { max-width: 100%; border-radius: 0.5em; }
    .readme-content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
    .readme-content th, .readme-content td { border: 1px solid #262626; padding: 0.4em 0.6em; text-align: left; }
    .readme-content th { background: #171717; }
    .readme-content blockquote { border-left: 3px solid #ef4444; padding-left: 1em; color: #a3a3a3; margin: 0.5em 0; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ===== HEADER ===== -->
  <header class="border-b border-ovos-card px-6 py-3 flex items-center gap-4 sticky top-0 bg-ovos-bg z-20">
    <a href="#/" class="flex items-center gap-2 hover:no-underline">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="text-lg font-bold text-ovos-accent">OVOS Localize</span>
    </a>
    <nav class="hidden sm:flex gap-4 ml-4 text-sm">
      <a href="#/" class="text-ovos-muted hover:text-ovos-text">Dashboard</a>
      <a href="#/stats" class="text-ovos-muted hover:text-ovos-text">Stats</a>
      <a href="#/entities" class="text-ovos-muted hover:text-ovos-text">Entities</a>
      <a href="#/how-it-works" class="text-ovos-muted hover:text-ovos-text">How it works</a>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <button onclick="showOnboarding()" id="profile-btn" class="text-sm px-3 py-1.5 rounded-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-2" title="Your languages">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Set languages
      </button>
    </div>
  </header>

  <main id="app" class="mx-auto px-4 sm:px-6 py-6"></main>

  <footer class="border-t border-ovos-card mt-12 py-6 px-6 text-center text-xs text-ovos-muted">
    <p>Developed by <a href="https://tigregotico.pt" target="_blank" class="font-medium">TigreGoticoLda</a> with <span class="text-red-500">&hearts;</span> for the <a href="https://openvoiceos.org" target="_blank" class="font-medium">OpenVoiceOS</a> community</p>
    <div class="mt-2 flex items-center justify-center gap-4">
      <a href="https://github.com/OpenVoiceOS/ovos-localize" target="_blank">GitHub</a>
      <a href="#/how-it-works">How it works</a>
      <a href="#/stats">Stats</a>
      <a href="#/entities">Entities</a>
      <a href="https://matrix.to/#/#OpenVoiceOS:matrix.org" target="_blank">Matrix Chat</a>
    </div>
  </footer>
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <script>
    // =========================================================================
    // SUBMISSION (via GitHub Issues — zero auth required)
    // =========================================================================
    const LOCALIZE_REPO = 'OpenVoiceOS/ovos-localize';

    /**
     * Submit a translation by opening a pre-filled GitHub Issue.
     * A GitHub Action picks it up, creates a PR, and closes the issue.
     * The user only needs to be logged into GitHub — zero tokens required.
     */
    function submitTranslation(org, repo, filePath, newContent, lang, fileKey, branch = 'dev') {
      const b64Content = btoa(unescape(encodeURIComponent(newContent)));

      const title = encodeURIComponent(`[translate] ${lang}: ${org}/${repo} — ${fileKey}`);
      const body = encodeURIComponent(
        `> Submitted via [OVOS Localize](https://openvoiceos.github.io/ovos-localize/). ` +
        `A bot will create a PR automatically.\n\n` +
        `<!-- TRANSLATION_META\n` +
        `org: ${org}\n` +
        `repo: ${repo}\n` +
        `file_path: ${filePath}\n` +
        `lang: ${lang}\n` +
        `file_key: ${fileKey}\n` +
        `branch: ${branch}\n` +
        `-->\n\n` +
        `<content>\n${b64Content}\n</content>`
      );

      window.open(`https://github.com/${LOCALIZE_REPO}/issues/new?title=${title}&labels=translation&body=${body}`, '_blank');
      toast('GitHub issue page opened — click "Submit new issue" to complete.', 'green', 6000);
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

    async function showReadme(repoFullName) {
      const el = document.getElementById('modal-container');
      el.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:48rem;max-height:85vh;display:flex;flex-direction:column">
            <div class="flex items-center justify-between mb-3 flex-shrink-0">
              <h3 class="text-lg font-bold">README — ${escapeHtml(repoFullName)}</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text px-2">&times;</button>
            </div>
            <div class="flex-1 overflow-auto text-sm text-ovos-muted flex items-center justify-center">
              <span class="spinner"></span>&nbsp; Loading...
            </div>
          </div>
        </div>`;
      try {
        const r = await fetch('https://api.github.com/repos/' + repoFullName + '/readme', {
          headers: { 'Accept': 'application/vnd.github.html+json' },
          signal: AbortSignal.timeout(15000),
        });
        if (!r.ok) throw new Error(r.status === 404 ? 'No README found' : 'GitHub API ' + r.status);
        const html = await r.text();
        const content = el.querySelector('.overflow-auto');
        content.className = 'flex-1 overflow-auto text-sm readme-content p-1';
        content.innerHTML = html;
      } catch (e) {
        const content = el.querySelector('.overflow-auto');
        content.innerHTML = '<p class="text-red-400">Failed to load README: ' + escapeHtml(e.message) + '</p><p class="mt-2"><a href="https://github.com/' + repoFullName + '#readme" target="_blank">View on GitHub</a></p>';
      }
    }

    // =========================================================================
    // USER PROFILE (localStorage — languages)
    // =========================================================================
    function getProfile() {
      const p = localStorage.getItem('ovos_profile');
      return p ? JSON.parse(p) : null;
    }
    function saveProfile(profile) {
      localStorage.setItem('ovos_profile', JSON.stringify(profile));
      updateProfileUI();
    }
    function getUserLangs() {
      const p = getProfile();
      return p?.languages || [];
    }
    function hasCompletedOnboarding() { return !!getProfile(); }

    function updateProfileUI() {
      const btn = document.getElementById('profile-btn');
      if (!btn) return;
      const p = getProfile();
      if (p) {
        const langCount = p.languages.length;
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>${langCount} lang${langCount !== 1 ? 's' : ''}`;
        btn.title = `Your languages: ${p.languages.join(', ')}`;
      } else {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Set languages`;
      }
    }

    async function showOnboarding() {
      let langMeta = {};
      try {
        const coverage = await fetchJSON('data/coverage.json');
        langMeta = coverage.lang_meta || {};
      } catch {}

      const allLangs = Object.keys(langMeta).sort((a, b) => {
        const na = langMeta[a]?.native || a;
        const nb = langMeta[b]?.native || b;
        return na.localeCompare(nb);
      });

      const existing = getProfile();
      const selectedSet = new Set(existing?.languages || []);

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:36rem">
            <div class="text-center mb-4">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <h2 class="text-xl font-bold">${existing ? 'Update your languages' : 'Welcome to OVOS Localize!'}</h2>
              <p class="text-sm text-ovos-muted mt-1">${existing ? 'Change which languages you see.' : 'What languages do you speak? We will only show skills that need help in your languages.'}</p>
            </div>
            <div class="mb-3">
              <div class="search-box flex items-center px-3 py-2 gap-2 mb-3">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="lang-search" type="text" placeholder="Search languages..." class="bg-transparent text-sm text-ovos-text w-full outline-none placeholder-ovos-muted" oninput="filterOnboardingLangs()">
              </div>
              <div id="lang-grid" class="grid grid-cols-2 gap-1.5 max-h-64 overflow-auto pr-1">
                ${allLangs.map(code => {
                  const m = langMeta[code] || {};
                  const checked = selectedSet.has(code) ? 'checked' : '';
                  return `<label class="lang-option flex items-center gap-2 p-2 rounded-lg hover:bg-ovos-hover cursor-pointer text-sm" data-code="${code}" data-search="${(m.native||'').toLowerCase()} ${(m.display||'').toLowerCase()} ${code.toLowerCase()}">
                    <input type="checkbox" value="${code}" class="lang-cb accent-red-500 w-4 h-4" ${checked} onchange="updateOnboardingCount()">
                    <div>
                      <div class="font-medium">${escapeHtml(m.native || code)}</div>
                      <div class="text-xs text-ovos-muted">${escapeHtml(m.display || code)}</div>
                    </div>
                  </label>`;
                }).join('')}
              </div>
              <div class="mt-2 text-xs text-ovos-muted"><span id="onboarding-count">${selectedSet.size}</span> language${selectedSet.size !== 1 ? 's' : ''} selected</div>
            </div>
            <div class="flex items-center justify-between">
              <button onclick="closeModal();showRequestLangModal()" class="text-xs text-ovos-muted hover:text-ovos-text">Can't find your language? Request it</button>
              <div class="flex gap-2">
                ${existing ? '<button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover">Cancel</button>' : ''}
                <button onclick="saveOnboarding()" id="save-onboarding-btn" class="px-4 py-2 text-sm rounded-lg bg-ovos-accent text-ovos-bg font-bold hover:opacity-80 disabled:opacity-40" ${selectedSet.size === 0 && !existing ? 'disabled' : ''}>
                  ${existing ? 'Save' : 'Get started'}
                </button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function filterOnboardingLangs() {
      const q = (document.getElementById('lang-search')?.value || '').toLowerCase();
      document.querySelectorAll('.lang-option').forEach(el => {
        el.style.display = el.dataset.search.includes(q) ? '' : 'none';
      });
    }

    function updateOnboardingCount() {
      const count = document.querySelectorAll('.lang-cb:checked').length;
      const el = document.getElementById('onboarding-count');
      if (el) el.textContent = count;
      const btn = document.getElementById('save-onboarding-btn');
      if (btn) btn.disabled = count === 0;
    }

    function saveOnboarding() {
      const selected = Array.from(document.querySelectorAll('.lang-cb:checked')).map(cb => cb.value);
      if (selected.length === 0) { toast('Select at least one language', 'amber'); return; }
      const isFirst = !hasCompletedOnboarding();
      saveProfile({ languages: selected, createdAt: new Date().toISOString() });
      closeModal();
      toast(`Showing ${selected.length} language${selected.length > 1 ? 's' : ''}`, 'green');
      if (isFirst) {
        location.hash = '#/dashboard';
      } else {
        route();
      }
    }

    function showRequestLangModal() {
      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:28rem">
            <div class="text-center mb-4">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" class="mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
              <h3 class="text-lg font-bold">Request a new language</h3>
              <p class="text-sm text-ovos-muted mt-1">If your language isn't listed, we can add it!</p>
            </div>
            <div class="space-y-3 mb-4">
              <div>
                <label class="text-xs font-bold text-ovos-muted">Language name</label>
                <input id="req-lang-name" type="text" placeholder="e.g. Hindi, Swahili, Korean..."
                  class="mt-1 w-full bg-ovos-input text-ovos-text px-3 py-2 rounded-lg border border-ovos-card text-sm">
              </div>
              <div>
                <label class="text-xs font-bold text-ovos-muted">Language code <span class="font-normal">(optional)</span></label>
                <input id="req-lang-code" type="text" placeholder="e.g. hi-IN"
                  class="mt-1 w-full bg-ovos-input text-ovos-text px-3 py-2 rounded-lg border border-ovos-card text-sm mono">
              </div>
            </div>
            <button onclick="submitLangRequest()" class="w-full px-4 py-2.5 text-sm rounded-lg bg-ovos-accent text-white font-bold hover:opacity-80 mb-3">
              Open request on GitHub
            </button>
            <div class="mt-3 text-center">
              <button onclick="closeModal()" class="text-sm text-ovos-muted hover:text-ovos-text">Cancel</button>
            </div>
          </div>
        </div>`;
      setTimeout(() => document.getElementById('req-lang-name')?.focus(), 100);
    }

    function submitLangRequest() {
      const name = document.getElementById('req-lang-name')?.value.trim();
      const code = document.getElementById('req-lang-code')?.value.trim();
      if (!name) { toast('Enter a language name', 'amber'); return; }
      const title = encodeURIComponent('Add language: ' + name + (code ? ' (' + code + ')' : ''));
      const body = encodeURIComponent(
        '## New language request\\n\\n' +
        '- **Language**: ' + name + '\\n' +
        (code ? '- **Code**: `' + code + '`\\n' : '') +
        '\\nI am volunteering to help translate OVOS skills into this language.'
      );
      window.open('https://github.com/OpenVoiceOS/ovos-localize/issues/new?title=' + title + '&body=' + body + '&labels=new-language', '_blank');
      closeModal();
    }

    // =========================================================================
    // UI HELPERS
    // =========================================================================
    function toast(msg, color = 'blue', duration = 3000) {
      const colors = { green: 'bg-green-800 text-green-200', red: 'bg-red-800 text-red-200', blue: 'bg-neutral-800 text-neutral-200', amber: 'bg-amber-800 text-amber-200' };
      const id = 't' + Date.now();
      document.getElementById('toast-container').innerHTML = `<div id="${id}" class="toast ${colors[color]||colors.blue}">${escapeHtml(msg)}</div>`;
      if (duration > 0) setTimeout(() => document.getElementById(id)?.remove(), duration);
    }
    function showProgress(msg) {
      document.getElementById('toast-container').innerHTML = `<div class="toast bg-neutral-800 text-neutral-200 flex items-center gap-2"><span class="spinner"></span>${escapeHtml(msg)}</div>`;
    }
    function hideProgress() { document.getElementById('toast-container').innerHTML = ''; }

    const cache = {};
    async function fetchJSON(url) {
      if (cache[url]) return cache[url];
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Failed to fetch ${url}: ${r.status}`);
      const d = await r.json();
      cache[url] = d;
      return d;
    }

    async function fetchSkill(skillId) {
      const skill = await fetchJSON(`data/skills/${skillId}.json`);
      if (skill.chunks && skill.chunks.length > 0) {
        for (const chunk of skill.chunks) {
          const chunkData = await fetchJSON(`data/skills/${chunk}`);
          if (chunkData.files) {
            Object.assign(skill.files, chunkData.files);
          }
        }
      }
      return skill;
    }

    // =========================================================================

    // OVOS TRANSLATION API (auto-translate via community servers)
    // =========================================================================
    const TRANSLATE_SERVERS = [
      { name: "NLLB - Smart'Gic", url: "https://translator.smartgic.io/nllb" },
      { name: "NLLB - Ziggyai", url: "https://ovosnllb.ziggyai.online" },
      { name: "NLLB - TigreGotico", url: "https://nllb.tigregotico.pt" },
      { name: "Google Translate - TigreGotico", url: "https://google-translate.tigregotico.pt" },
    ];

    function getTranslateServer() {
      return localStorage.getItem('ovos_tx_server') || TRANSLATE_SERVERS[0].url;
    }
    function setTranslateServer(url) {
      localStorage.setItem('ovos_tx_server', url);
    }

    /** Check server status via GET /status */
    async function checkTxServerStatus(serverUrl) {
      try {
        const r = await fetch(`${serverUrl}/status`, { signal: AbortSignal.timeout(8000) });
        if (!r.ok) return { ok: false, error: `HTTP ${r.status}` };
        const data = await r.json();
        return {
          ok: true,
          plugin: data.translation_plugin || data.plugin_type || 'unknown',
          langs: data.langs || data.languages || [],
        };
      } catch (e) {
        return { ok: false, error: e.name === 'AbortError' ? 'Timeout (8s)' : (e.message || 'Connection failed') };
      }
    }

    /** Update the status dot in the action bar */
    async function updateTxStatusDot() {
      const dot = document.getElementById('tx-server-status');
      if (!dot) return;
      dot.className = 'w-2 h-2 rounded-full bg-yellow-500 flex-shrink-0 animate-pulse';
      const status = await checkTxServerStatus(getTranslateServer());
      dot.className = `w-2 h-2 rounded-full ${status.ok ? 'bg-green-500' : 'bg-red-500'} flex-shrink-0`;
      dot.title = status.ok ? `Online — ${status.plugin} (${status.langs.length} languages)` : `Offline — ${status.error}`;
    }

    function showTxServerModal() {
      const current = getTranslateServer();
      const isCustom = !TRANSLATE_SERVERS.some(s => s.url === current);

    /** Strip region from BCP-47 for the translate API (e.g. pt-BR → pt, en-US → en) */
    function langToShort(code) {
      return code.split('-')[0].toLowerCase();
    }

    /**
     * Translate a single string via OVOS translate server.
     * GET /translate/{src}/{tgt}/{text}
     */
    async function ovsTranslate(text, srcLang, tgtLang, serverUrl) {
      const src = langToShort(srcLang);
      const tgt = langToShort(tgtLang);
      const url = `${serverUrl}/translate/${src}/${tgt}/${encodeURIComponent(text)}`;
      const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(`Translation server returned ${r.status}`);
      const data = await r.json().catch(() => r.text());
      return typeof data === 'string' ? data : (data.translation || data.translated || String(data));
    }

    /**
     * Auto-translate all lines from source to target language.
     * Translates line-by-line to preserve structure.
     */
    async function autoTranslateLines(lines, tgtLang, serverUrl, onProgress, srcLang = 'en-US') {
      const results = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith('#')) {
          results.push(line);
          continue;
        }
        // Preserve {slots} — replace with placeholders before translating
        const slots = [];
        const cleaned = line.replace(/\{(\w+)\}/g, (match) => {
          slots.push(match);
          return `__SLOT${slots.length - 1}__`;
        });
        // Preserve (a|b) alternatives — translate each option separately
        const altGroups = [];
        const withoutAlts = cleaned.replace(/\(([^)]+)\)/g, (match, group) => {
          altGroups.push(group);
          return `__ALT${altGroups.length - 1}__`;
        });

        let translated;
        try {
          translated = await ovsTranslate(withoutAlts, srcLang, tgtLang, serverUrl);
        } catch {
          translated = withoutAlts; // Keep original on failure
        }

        // Restore alternatives (translate each option)
        for (let j = 0; j < altGroups.length; j++) {
          const options = altGroups[j].split('|');
          const translatedOpts = [];
          for (const opt of options) {
            if (!opt.trim()) { translatedOpts.push(''); continue; }
            try {
              translatedOpts.push(await ovsTranslate(opt.trim(), srcLang, tgtLang, serverUrl));
            } catch {
              translatedOpts.push(opt);
            }
          }
          translated = translated.replace(`__ALT${j}__`, `(${translatedOpts.join('|')})`);
        }

        // Restore slots
        for (let j = 0; j < slots.length; j++) {
          translated = translated.replace(`__SLOT${j}__`, slots[j]);
        }

        results.push(translated);
        if (onProgress) onProgress(i + 1, lines.length);
      }
      return results;
    }

    function coverageBadge(pct) {
      if (pct == null) return '<span class="badge badge-gray">missing</span>';
      const cls = pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-red';
      return `<span class="badge ${cls}">${pct.toFixed(0)}%</span>`;

    function highlightSlots(text) { return text.replace(/\{(\w+)\}/g, '<span class="slot">{$1}</span>'); }
    function highlightCodeStrings(code) {
      // Highlight string literals (single and double quoted)
      return code
        .replace(/((?:&quot;|")[^"]*(?:&quot;|"))/g, '<span style="color:#a5d6ff">$1</span>')
        .replace(/(&#x27;[^']*&#x27;)/g, '<span style="color:#a5d6ff">$1</span>')

    function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function progressBar(pct, size = 'sm') {
      const h = size === 'sm' ? 'h-1.5' : 'h-2.5';
      const color = pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';

    }

    // =========================================================================
    // TEMPLATE EXPANSION — port of ovos_utils.bracket_expansion.expand_template
    // =========================================================================
    function expandTemplate(template) {
      // [optional] → (optional|)
      let t = template.replace(/\[([^\[\]]+)\]/g, '($1|)');

      function expandAlternatives(text) {
        const parts = [];
        const segments = text.split(/(\([^()]+\))/);
        for (const seg of segments) {
          if (seg.startsWith('(') && seg.endsWith(')')) {
            parts.push(seg.slice(1, -1).split('|'));
          } else {
            parts.push([seg]);
          }
        }
        // Cartesian product
        return cartesian(parts).map(combo => combo.join('').replace(/\s+/g, ' ').trim());
      }

      function cartesian(arrays) {
        return arrays.reduce((acc, arr) => {
          const result = [];
          for (const a of acc) for (const b of arr) result.push([...a, b]);
          return result;
        }, [['']]);  // Start with array containing empty string, not empty array
      }

      // Iteratively expand until stable
      let result = new Set([t]);
      for (let i = 0; i < 10; i++) { // safety limit
        const expanded = new Set();
        for (const text of result) {
          for (const e of expandAlternatives(text)) expanded.add(e);
        }
        if (expanded.size === result.size && [...expanded].every(x => result.has(x))) break;
        result = expanded;
      }
      return [...result].filter(s => s.trim()).sort();
    }

    /** Expand all lines and return total count + sample */
    function expandAllLines(text, maxPerLine = 50, maxTotal = 200) {
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
      let total = 0;
      const samples = [];
      for (const line of lines) {
        const expanded = expandTemplate(line);
        total += expanded.length;
        // Keep some samples
        for (const e of expanded.slice(0, maxPerLine)) {
          if (samples.length < maxTotal) samples.push(e);
        }
      }
      return { total, samples, lineCount: lines.length };
    }

    function highlightJson(jsonStr) {
      return jsonStr
        .replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span style="color:#fca5a5">$1</span>:')  // keys in red
        .replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span style="color:#86efac">$1</span>')  // string values in green
        .replace(/:\s*(true|false|null)/g, ': <span style="color:#fde047">$1</span>')     // booleans in yellow
        .replace(/:\s*(\d+(?:\.\d+)?)/g, ': <span style="color:#93c5fd">$1</span>');      // numbers in blue
    }

    function filterDashboard() {
      const { repos, coverage, langs, allLangs } = window._dashData;
      const search = (document.getElementById('skill-search')?.value || '').toLowerCase();
      const langFilterRaw = document.getElementById('lang-filter')?.value || '';
      const statusFilter = document.getElementById('status-filter')?.value || '';

      // Determine which languages to consider
      let langFilter = '';
      let displayLangsForCard;
      if (langFilterRaw === '__all__') {
        displayLangsForCard = allLangs;
      } else if (langFilterRaw) {
        langFilter = langFilterRaw;
        displayLangsForCard = [langFilterRaw];
      } else {
        displayLangsForCard = langs; // user's languages
      }
      const grid = document.getElementById('skill-grid');

      let filtered = repos;
      if (search) filtered = filtered.filter(r => r.id.includes(search) || (r.skill_class||'').toLowerCase().includes(search));

      let html = '';
      let count = 0;
      for (const repo of filtered) {
        const m = coverage.matrix[repo.id] || {};

        // Compute overall coverage for this skill
        let totalPct = 0, pctCount = 0;
        for (const l of displayLangsForCard) {
          if (m[l]?.combined_pct != null) { totalPct += m[l].combined_pct; pctCount++; }
        }
        const avgPct = pctCount > 0 ? totalPct / pctCount : 0;

        if (statusFilter === 'needs-work' && avgPct >= 50) continue;
        if (statusFilter === 'partial' && (avgPct < 50 || avgPct >= 80)) continue;
        if (statusFilter === 'good' && avgPct < 80) continue;

        // Find languages needing the most work
        const needsWork = [];
        for (const l of displayLangsForCard) {
          const pct = m[l]?.combined_pct;
          if (pct != null && pct < 80) needsWork.push({ lang: l, pct });
        }
        needsWork.sort((a, b) => a.pct - b.pct);

        count++;
        // Pick the best default language to link to
        const defaultLang = needsWork.length > 0 ? needsWork[0].lang : (displayLangsForCard[0] || 'en-US');

        html += `
          <div class="skill-card p-4 bg-ovos-card rounded-xl">
            <div class="flex items-start justify-between mb-2">
              <a href="#/skill/${repo.id}/${defaultLang}" class="hover:no-underline">
                <div class="font-bold text-ovos-text text-sm">${repo.id.replace('ovos-skill-', '')}</div>
                <div class="text-xs text-ovos-muted">${repo.skill_class || 'Unknown'}</div>
              </a>
              ${coverageBadge(avgPct > 0 ? avgPct : null)}
            </div>
            ${progressBar(avgPct)}
            <div class="mt-2 text-xs text-ovos-muted">${repo.languages.length} languages, ${repo.file_count} files</div>
            <div class="mt-2 flex flex-wrap gap-1">
              ${displayLangsForCard.map(l => {
                const pct = m[l]?.combined_pct;
                const cls = pct == null ? 'badge-gray' : pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-amber' : 'badge-red';
                return `<a href="#/skill/${repo.id}/${l}" class="badge ${cls} hover:no-underline hover:opacity-80">${l} ${pct != null ? pct.toFixed(0)+'%' : 'new'}</a>`;
              }).join('')}
            </div>
          </div>`;
      }

      grid.innerHTML = html || '<p class="text-ovos-muted col-span-3 text-center py-8">No skills match your filters.</p>';
      document.getElementById('result-count').textContent = `${count} skill${count !== 1 ? 's' : ''}`;
    }

          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold text-green-400">${withFile}</div>

            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold text-red-400">${gaps}</div>
              <div class="text-xs text-ovos-muted">missing .entity file</div>
            </div>
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-xl font-bold">${totalSamples.toLocaleString()}</div>

          <div id="entity-list" class="space-y-3"></div>

    function filterEntities() {
      const db = window._entityDb || [];
      const displayLangs = window._entityDisplayLangs || [];
      const meta = window._entityMeta || {};
      const search = (document.getElementById('entity-search')?.value || '').toLowerCase();
      const typeFilter = document.getElementById('entity-type-filter')?.value || '';
      const list = document.getElementById('entity-list');
      const countEl = document.getElementById('entity-count');

      let filtered = db;
      if (search) filtered = filtered.filter(e => e.name.toLowerCase().includes(search) || e.skill.toLowerCase().includes(search));
      if (typeFilter === 'gap') filtered = filtered.filter(e => !e.has_entity_file);
      if (typeFilter === 'has') filtered = filtered.filter(e => e.has_entity_file);

      if (countEl) countEl.textContent = `${filtered.length} entities`;

      list.innerHTML = filtered.map(entity => {
        const enData = entity.langs['en-US'];
        const enSamples = enData?.samples || [];
        const enCount = enData?.count || 0;

        const entityFileName = entity.name + '.entity';

        if (!entity.has_entity_file) {
          // GAP — slot used in intents but no .entity file
          // Build GitHub "new file" URL by guessing locale path from the repo
          const [gapOrg, gapRepo] = entity.repo.split('/');
          return `
            <div class="bg-ovos-card rounded-xl p-4" style="border-left:3px solid #ef4444">
              <div class="flex items-start justify-between mb-1">
                <div class="flex items-center gap-2">
                  <span class="slot text-base">{${escapeHtml(entity.name)}}</span>
                  <span class="badge badge-red">no .entity file</span>
                </div>
                <div class="text-xs text-ovos-muted">from <a href="#/skill/${entity.skill}/en-US">${entity.skill.replace('ovos-skill-','').replace('ovos-','')}</a></div>
              </div>
              <div class="text-xs text-ovos-muted">
                Used in: ${entity.used_in_intents.map(i => `<span class="mono">${escapeHtml(i)}</span>`).join(', ')}
              </div>
              <div class="text-xs text-ovos-muted mt-1 mb-2">
                No training data exists. Click a language below to create <code>${escapeHtml(entityFileName)}</code> on GitHub — add example values, one per line.
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${displayLangs.map(lang => {
                  const href = `#/skill/${entity.skill}/${encodeURIComponent(entityFileName)}/${lang}`;
                  return `<a href="${href}" class="badge badge-gray hover:no-underline hover:opacity-80" title="Create ${entityFileName} for ${(meta[lang]?.native||lang)}">${lang} <span class="font-normal">+ create</span></a>`;
                }).join('')}
              </div>
            </div>`;
        }

        // HAS entity file — show ALL user languages (including missing ones)
        return `
          <div class="bg-ovos-card rounded-xl p-4">
            <div class="flex items-start justify-between mb-2">
              <div>
                <div class="flex items-center gap-2">
                  <span class="slot text-base">{${escapeHtml(entity.name)}}</span>
                  <span class="badge badge-green">.entity</span>
                </div>
                <div class="text-xs text-ovos-muted">from <a href="#/skill/${entity.skill}/en-US">${entity.skill.replace('ovos-skill-','').replace('ovos-','')}</a>
                  ${entity.used_in_intents.length ? ` &middot; used in: ${entity.used_in_intents.map(i => `<span class="mono">${escapeHtml(i)}</span>`).join(', ')}` : ''}
                </div>
              </div>
              <div class="text-right text-xs text-ovos-muted">${enCount} English samples</div>
            </div>
            ${enSamples.length ? `<div class="mb-3 text-xs">
              <span class="text-ovos-muted">Examples:</span>
              ${enSamples.map(s => `<span class="inline-block bg-ovos-bg px-1.5 py-0.5 rounded mr-1 mb-1 mono">${escapeHtml(s)}</span>`).join('')}
              ${enCount > 15 ? `<span class="text-ovos-muted">+${enCount - 15} more</span>` : ''}
            </div>` : ''}
            <div class="flex flex-wrap gap-1.5">
              ${displayLangs.map(lang => {
                const ld = entity.langs[lang];
                const count = ld?.count || 0;
                const target = Math.max(enCount, 5);
                const hasData = count > 0;
                const cls = !hasData ? 'badge-gray' : count >= target ? 'badge-green' : count >= target * 0.5 ? 'badge-amber' : 'badge-red';
                const label = hasData ? count : 'add';
                const href = `#/skill/${entity.skill}/${encodeURIComponent(entity.file_key)}/${lang}`;
                return `<a href="${href}" class="badge ${cls} hover:no-underline hover:opacity-80" title="${(meta[lang]?.native||lang)}: ${hasData ? count + ' samples' : 'no samples yet — click to add'}">${lang} <span class="font-normal">${label}</span></a>`;
              }).join('')}
            </div>
          </div>`;
      }).join('') || '<p class="text-ovos-muted text-center py-8">No entities match.</p>';
    }

    // =========================================================================

    async function renderSkillDetail(el, skillId, activeLang) {
      const skill = await fetchSkill(skillId);
      const allSkillLangs = skill.languages;
      const userLangs = getUserLangs();
      const tabLangs = userLangs.length > 0 ? allSkillLangs.filter(l => userLangs.includes(l)) : allSkillLangs;

      // Stats for active language

      const missing = enFileCount - translated;
      const pct = enFileCount ? (translated / enFileCount * 100) : 0;
      const totalErrors = Object.values(skill.files).reduce((s, fd) =>
        s + (fd.langs[activeLang]?.validation?.filter(v => v.severity === 'error').length || 0), 0);

              README
            </button>
          </div>

          <!-- Language tabs -->
          <div class="flex flex-wrap gap-1 mb-6 border-b border-ovos-card pb-3">
            ${tabLangs.map(l => {
              const lPct = enFileCount ? (Object.values(skill.files).filter(fd => fd.langs[l]).length / enFileCount * 100) : 0;
              const isActive = l === activeLang;
              return `<a href="#/skill/${skillId}/${l}" class="px-3 py-1.5 rounded-lg text-sm hover:no-underline ${isActive ? 'bg-ovos-accent text-white font-bold' : 'bg-ovos-card text-ovos-muted hover:bg-ovos-hover'}">${l} <span class="text-xs opacity-70">${lPct.toFixed(0)}%</span></a>`;

            ${tabLangs.length < allSkillLangs.length ? `<button onclick="showOnboarding()" class="px-3 py-1.5 rounded-lg text-sm bg-ovos-card text-ovos-muted hover:bg-ovos-hover">+ more</button>` : ''}
          </div>

          <!-- Coverage summary for this language -->
          <div class="grid grid-cols-4 gap-3 mb-6">
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-lg font-bold">${translated}/${enFileCount}</div>
              <div class="text-xs text-ovos-muted">files translated</div>
            </div>
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-lg font-bold ${pct >= 80 ? 'text-green-400' : pct >= 50 ? 'text-yellow-400' : 'text-red-400'}">${pct.toFixed(0)}%</div>
              <div class="text-xs text-ovos-muted">coverage</div>
            </div>
            <div class="p-3 bg-ovos-card rounded-xl text-center">
              <div class="text-lg font-bold ${missing > 0 ? 'text-red-400' : 'text-green-400'}">${missing}</div>
              <div class="text-xs text-ovos-muted">missing files</div>
            </div>

              <div class="text-lg font-bold ${totalErrors > 0 ? 'text-red-400' : 'text-green-400'}">${totalErrors + totalWarnings}</div>
              <div class="text-xs text-ovos-muted">issues</div>
            </div>
          </div>

          <!-- File list for this language -->
          <div class="space-y-2">
            ${Object.entries(skill.files).map(([fileKey, fileData]) => {
              const ld = fileData.langs[activeLang];
              const enLd = fileData.langs['en-US'];
              const exists = !!ld;
              const errs = ld?.validation?.filter(v => v.severity === 'error').length || 0;
              const warns = ld?.validation?.filter(v => v.severity === 'warning').length || 0;
              const lineCount = ld?.line_count || 0;
              const enLineCount = enLd?.line_count || 0;

              // Status badge

                      <span class="font-medium mono text-sm">${fileKey}</span>
                      <span class="badge badge-blue mono">.${fileData.type}</span>
                      ${statusBadge}
                    </div>
                    <div class="text-xs text-ovos-muted mt-0.5">${escapeHtml(typeHelp.substring(0, 80))}</div>
                    ${preview ? `<div class="mt-1 text-xs truncate">${preview}</div>` : ''}
                  </div>
                  <div class="text-right flex-shrink-0 text-xs text-ovos-muted">
                    ${exists ? `${lineCount} lines` : ''}
                    ${enLineCount ? `<br><span class="text-ovos-muted">en: ${enLineCount}</span>` : ''}
                  </div>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" class="flex-shrink-0"><path d="m9 18 6-6-6-6"/></svg>
                </div>
              </a>`;
            }).join('')}
          </div>
        </div>`;
    }

    async function renderEditor(el, skillId, fileKey, lang) {
      const skill = await fetchSkill(skillId);
      const fileData = skill.files[fileKey];
      const [org, repo] = skill.repo.split('/');

      // Handle creating a brand-new file (e.g. entity file that doesn't exist yet)
      const isCreateMode = !fileData;
      const fileType = isCreateMode ? (fileKey.endsWith('.entity') ? 'entity' : fileKey.split('.').pop()) : fileData.type;

      const targetData = fileData?.langs?.[lang];
      const ctx = isCreateMode ? null : fileData.context;
      const editUrl = isCreateMode ? '' : ((fileData.edit_urls || {})[lang] || '');
      const filePath = targetData?.file_path || (isCreateMode ? '' : filePathFromEditUrl(editUrl));
      const currentText = targetData?.entries?.length ? targetData.entries.map(e => e.text).join('\n') : '';
      const isNew = isCreateMode || !targetData || targetData.entries.length === 0;
      const fileHelp = isCreateMode
        ? `Create a new ${fileKey} file. Add example values, one per line.`
        : (FILE_TYPE_HELP[fileData.type] || 'Translate this file to your language.');
      const isJsonFile = !isCreateMode && (fileData.type === 'skill.json' || fileData.type === 'settingsmeta');
      const hasExpansion = isCreateMode ? fileType === 'entity' : ['intent', 'voc', 'dialog'].includes(fileData.type);

      // Source language
      const availableSrcLangs = isCreateMode ? [] : Object.keys(fileData.langs).filter(l => l !== lang);
      const storedSrc = localStorage.getItem('ovos_src_lang');
      const defaultSrc = (storedSrc && availableSrcLangs.includes(storedSrc)) ? storedSrc
        : availableSrcLangs.includes('en-US') ? 'en-US'
        : availableSrcLangs[0] || lang;
      const srcLang = defaultSrc;
      const srcData = isCreateMode ? null : fileData?.langs?.[srcLang];

      // Compute file path for new files — guess from locale convention
      let newFilePath = filePath;
      if (!filePath && srcData?.file_path) {
        newFilePath = srcData.file_path.replace(new RegExp(`/${srcLang.toLowerCase()}/|/${srcLang}/`, 'i'), `/${lang}/`);
      }
      if (!newFilePath && isCreateMode) {
        // For brand-new files, guess path from other files in this skill
        const anyFile = Object.values(skill.files)[0];
        const anyPath = anyFile?.langs?.['en-US']?.file_path || anyFile?.langs?.[Object.keys(anyFile?.langs || {})[0]]?.file_path || '';
        if (anyPath) {
          // e.g. "locale/en-us/vocab/Test.voc" → "locale/{lang}/{fileKey}"
          const localeMatch = anyPath.match(/^(.*\/locale\/)[^/]+\//);
          if (localeMatch) newFilePath = localeMatch[1] + lang.toLowerCase() + '/' + fileKey;

            <button onclick="showReadme('${skill.repo}')" class="ml-auto text-xs px-2 py-1 rounded border border-ovos-card hover:bg-ovos-hover flex items-center gap-1" title="Show skill README">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              README
            </button>
          </div>
        </div>

        <!-- Action bar -->
        <div class="flex items-center gap-2 mb-3 flex-wrap">
          <span id="editor-status" class="text-xs text-ovos-muted"></span>
          ${isNew ? '<span class="badge badge-amber">new file</span>' : ''}
          <div class="ml-auto flex gap-2">
            ${!isJsonFile ? `
            <!-- Auto-translate button + server picker -->
            <div class="flex items-center gap-0">
              <button id="auto-tx-btn" onclick="handleAutoTranslate('${lang}')" class="text-xs px-3 py-1.5 rounded-l-lg border border-ovos-card hover:bg-ovos-hover flex items-center gap-1" title="Auto-translate English source using OVOS community translation servers">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>

              Validate

            </button>
            ${ctx?.handler_source ? `

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

    // --- Expansion preview ---
    let _previewDebounce = null;

    // --- JSON preview ---

      const fields = document.querySelectorAll('.json-field');

      const obj = {};
      // Start with non-translatable fields from source
      for (const e of srcEntries) {

          if (e.index != null) {

            obj[e.key].push(e.text);
          } else {

          }

      // Add translatable fields from form
      fields.forEach(field => {

          obj[key] = field.value.split('\n').filter(l => l.trim());

        }
      });

      if (Object.keys(obj).length === 0) {
        preview.innerHTML = '<span class="text-ovos-muted">Empty</span>';
        status.textContent = '';

      const formatted = JSON.stringify(obj, null, 2);

    async function handleAutoTranslate(tgtLang) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;

      // Get source lines from the reference language
      const { skillId, fileKey, srcLang: editorSrcLang } = editor.dataset;
      const fromLang = editorSrcLang || 'en-US';
      if (!skillId) { toast('Cannot determine skill', 'red'); return; }

      let sourceLines;
      try {
        const skill = await fetchSkill(skillId);
        const fd = skill.files[fileKey];
        const srcLangData = fd?.langs?.[fromLang];
        if (!srcLangData?.entries?.length) { toast(`No source file in ${fromLang} to translate from`, 'red'); return; }
        sourceLines = srcLangData.entries.map(e => e.text);
      } catch (e) {
        toast(`Failed to load source: ${e.message}`, 'red'); return;
      }

      const hasExisting = editor.value.trim().length > 0;
      if (hasExisting && !confirm('This will replace the current translation with an auto-translated version. Continue?')) return;

      const serverUrl = getTranslateServer();
      const btn = document.getElementById('auto-tx-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;

      try {
        const translated = await autoTranslateLines(sourceLines, tgtLang, serverUrl, (done, total) => {
          btn.innerHTML = `<span class="spinner"></span> ${done}/${total}`;
        }, fromLang);

        editor.value = translated.join('\n');
        editor.dispatchEvent(new Event('input'));
        toast(`Auto-translated ${translated.length} lines. Review and edit before submitting!`, 'green', 5000);
      } catch (e) {
        toast(`Translation failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    function runClientValidation() {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;
      const text = editor.value;
      const fileType = editor.dataset.fileType;
      const ctx = window._editorCtx;
      const issues = [];

      // Empty check
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
      if (!text.trim()) {
        issues.push({ severity: 'error', message: 'File is empty' });
      }

      if (fileType === 'intent') {
        // Expansion count
        const expanded = expandAllLines(text);
        if (expanded.total > 0 && expanded.total < 10) {
          issues.push({ severity: 'warning', message: `Only ${expanded.total} expanded sentences (10+ recommended for Padatious)` });
        }
        // Unbalanced parentheses
        for (let i = 0; i < lines.length; i++) {
          const opens = (lines[i].match(/\(/g) || []).length;
          const closes = (lines[i].match(/\)/g) || []).length;
          if (opens !== closes) issues.push({ severity: 'error', message: `Unbalanced parentheses on line: "${lines[i].substring(0, 40)}..."` });
        }
        // Slot preservation
        if (ctx?.slots?.length) {
          const usedSlots = new Set(text.match(/\{(\w+)\}/g)?.map(s => s.slice(1,-1)) || []);
          for (const s of ctx.slots) {
            if (!usedSlots.has(s)) issues.push({ severity: 'error', message: `Missing slot {${s}} — must be kept in translation` });
          }
        }
      }

      if (fileType === 'dialog') {
        // Slot preservation
        if (ctx?.slots?.length) {
          const usedSlots = new Set(text.match(/\{(\w+)\}/g)?.map(s => s.slice(1,-1)) || []);
          for (const s of ctx.slots) {
            if (!usedSlots.has(s)) issues.push({ severity: 'error', message: `Missing variable {${s}} — must be kept in translation` });
          }
        }
        // Few variants
        if (lines.length > 0 && lines.length < 2) {
          issues.push({ severity: 'warning', message: 'Only 1 response variant — 2+ recommended for natural speech variety' });
        }
      }

      if (fileType === 'voc') {
        // Long keywords
        for (const line of lines) {
          if (line.split(/\s+/).length > 5) {
            issues.push({ severity: 'warning', message: `Long keyword: "${line.substring(0,30)}..." — vocab entries should be 1-3 words` });
          }
        }
      }

      if (fileType === 'rx') {
        // Regex compilation
        for (const line of lines) {
          try { new RegExp(line); } catch (e) {
            issues.push({ severity: 'error', message: `Invalid regex: "${line.substring(0,30)}..." — ${e.message}` });
          }
        }
      }

      if (editor.dataset.isJson) {
        try { JSON.parse(text); } catch (e) {
          issues.push({ severity: 'error', message: `Invalid JSON: ${e.message}` });
        }
      }

      // Show results
      const errors = issues.filter(i => i.severity === 'error');
      const warnings = issues.filter(i => i.severity === 'warning');

      if (issues.length === 0) {
        toast('No issues found!', 'green');
        return;
      }

      let body = '';
      if (errors.length) {
        body += `<div class="mb-3"><div class="text-sm font-bold text-red-400 mb-1">${errors.length} error${errors.length>1?'s':''}</div>`;
        body += errors.map(i => `<div class="text-xs text-red-400 flex items-start gap-1 mb-1"><span>&#9679;</span> ${escapeHtml(i.message)}</div>`).join('');
        body += '</div>';
      }
      if (warnings.length) {
        body += `<div><div class="text-sm font-bold text-yellow-400 mb-1">${warnings.length} warning${warnings.length>1?'s':''}</div>`;
        body += warnings.map(i => `<div class="text-xs text-yellow-400 flex items-start gap-1 mb-1"><span>&#9651;</span> ${escapeHtml(i.message)}</div>`).join('');
        body += '</div>';
      }

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:28rem">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-lg font-bold">Validation results</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text text-lg px-2">&times;</button>
            </div>
            ${body}
            <div class="mt-4 text-center">
              <button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover">Close</button>
            </div>
          </div>
        </div>`;
    }

    function showContextModal() {

          <div class="text-xs text-ovos-muted">Handler method</div>
          <div class="mono text-sm">${ctx.handler_method}() <span class="text-ovos-muted">at line ${ctx.handler_line || '?'}</span></div>
          ${ctx.triggers_dialog?.length ? `<div class="text-xs text-ovos-muted mt-1">Triggers: ${ctx.triggers_dialog.map(d=>`<code>${d}.dialog</code>`).join(', ')}</div>` : ''}
        </div>`;
      }

      // Slots
      if (ctx?.slots?.length) {
        body += `<div class="p-3 bg-ovos-bg rounded-lg mb-3">
          <div class="text-xs text-red-400 font-bold mb-2">Variables — keep these exactly as-is in your translation</div>
          <div class="space-y-1">
            ${ctx.slots.map(s => `<div class="flex items-center gap-2 cursor-pointer hover:bg-ovos-card/50 px-2 py-1 rounded" onclick="closeModal();insertSlot('${s}')">
              <span class="slot">{${s}}</span>
              <span class="text-xs text-ovos-muted">${ctx.slot_descriptions?.[s] ? escapeHtml(ctx.slot_descriptions[s]) : 'click to insert at cursor'}</span>
            </div>`).join('')}
          </div>
        </div>`;
      }

      // IntentBuilder
      if (ctx?.builder_chain) {
        body += `<div class="p-3 bg-ovos-bg rounded-lg mb-3">
          <div class="text-xs text-ovos-muted mb-1">Adapt IntentBuilder chain</div>
          <pre class="text-xs mono">name: "${ctx.builder_chain.name || ''}"
require: [${(ctx.builder_chain.require||[]).join(', ')}]
optionally: [${(ctx.builder_chain.optionally||[]).join(', ')}]</pre>
        </div>`;
      }

      // Related / used by
      if (ctx?.related_files?.length) body += `<div class="text-xs text-ovos-muted mb-2">Related files: ${ctx.related_files.join(', ')}</div>`;
      if (ctx?.used_by_intents?.length) body += `<div class="text-xs text-ovos-muted mb-2">Used by intents: ${ctx.used_by_intents.join(', ')}</div>`;

      // Tips
      if (ctx?.tips?.length) {
        body += `<div class="p-3 bg-ovos-bg rounded-lg border-l-2 border-red-500">
          <div class="text-xs font-bold text-ovos-accent mb-1">Translation tips</div>
          <ul class="space-y-1 text-xs text-ovos-muted list-disc ml-3">
            ${ctx.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}
          </ul>
        </div>`;
      }

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:32rem;max-height:80vh;display:flex;flex-direction:column">
            <div class="flex items-center justify-between mb-3 flex-shrink-0">
              <h3 class="text-lg font-bold">Translation context</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text text-lg px-2">&times;</button>
            </div>
            <div class="flex-1 overflow-auto text-sm">${body}</div>
          </div>
        </div>`;
    }

    function showCodeModal() {
      const ctx = window._editorCtx;
      if (!ctx?.handler_source) return;

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:48rem;max-height:80vh;display:flex;flex-direction:column">
            <div class="flex items-center justify-between mb-3 flex-shrink-0">
              <div>
                <h3 class="text-lg font-bold">Skill source code</h3>
                <p class="text-xs text-ovos-muted">The Python function that uses this locale file</p>
              </div>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text text-lg px-2">&times;</button>
            </div>
            ${ctx.handler_method ? `<div class="text-xs text-ovos-muted mb-2 mono">${ctx.handler_method}() — line ${ctx.handler_line || '?'}</div>` : ''}
            <pre class="flex-1 overflow-auto text-xs mono leading-relaxed p-4 bg-ovos-bg rounded-lg text-ovos-muted"><code>${highlightCodeStrings(escapeHtml(ctx.handler_source))}</code></pre>
          </div>
        </div>`;
    }

    function changeSrcLang(newSrcLang, skillId, fileKeyEncoded, lang) {
      // Store the new source language preference and re-render
      localStorage.setItem('ovos_src_lang', newSrcLang);
      // Re-render the editor (the hash doesn't change, so manually call route)
      const app = document.getElementById('app');
      renderEditor(app, skillId, decodeURIComponent(fileKeyEncoded), lang);
    }

    function insertSlot(name) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;
      const s = editor.selectionStart, e = editor.selectionEnd;
      const ins = `{${name}}`;
      editor.value = editor.value.substring(0, s) + ins + editor.value.substring(e);
      editor.selectionStart = editor.selectionEnd = s + ins.length;
      editor.focus();
      editor.dispatchEvent(new Event('input'));
    }

    async function handleSubmitPR() {
      const editor = document.getElementById('translation-editor');
      const newContent = editor.value;
      if (newContent === editor.dataset.originalText) { toast('No changes to submit', 'amber'); return; }
      if (!newContent.trim()) { toast('Translation is empty', 'red'); return; }
      const { org, repo, filePath, lang, fileKey } = editor.dataset;
      if (!filePath) { toast('Cannot determine file path — use "Edit on GitHub" instead', 'red'); return; }
      const lines = newContent.split('\n').filter(l => l.trim()).length;
      if (!confirm(`Submit ${lines} line(s) for "${fileKey}" (${lang})?\n\nA bot will open a pull request to ${org}/${repo} on your behalf.`)) return;
      const btn = document.getElementById('submit-pr-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Submitting...';
      try {
        const content = newContent.endsWith('\n') ? newContent : newContent + '\n';
        await submitTranslation(org, repo, filePath, content, lang, fileKey);
        editor.dataset.originalText = editor.value;
        document.getElementById('editor-status').innerHTML = '<span class="badge badge-green">submitted!</span>';
      } catch (e) {
        toast(`Failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit translation';
      }
    }
  </script>
</body>
</html>
