          ).join('') + (total > samples.length ? `<div class="text-ovos-muted mt-1">... and ${total - samples.length} more</div>` : '');
        }
      } else if (hasExpansion && srcData?.entries?.length) {
        const enText = srcData.entries.map(e => e.text).join('\n');
        const { total, samples } = expandAllLines(enText, 30, 150);
        const enCountEl = document.getElementById('en-expansion-count');
        const enListEl = document.getElementById('en-expansion-list');
        if (enCountEl) enCountEl.textContent = `${total} sentences`;
        if (enListEl) {
          enListEl.innerHTML = samples.map((s, i) =>
            `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
          ).join('') + (total > samples.length ? `<div class="text-ovos-muted mt-1">... and ${total - samples.length} more</div>` : '');
        }
      }
      editor.focus();

      // Check translation server status (background)
      if (!isJsonFile) updateTxStatusDot();
    }

    // --- Expansion preview ---
    let _previewDebounce = null;
    function updateExpansionPreview(text) {
      clearTimeout(_previewDebounce);
      _previewDebounce = setTimeout(() => {
        const { total, samples, lineCount } = expandAllLines(text, 30, 150);
        const countEl = document.getElementById('expansion-count');
        const listEl = document.getElementById('expansion-list');
        if (!countEl || !listEl) return;

        // Color the count based on how many expansions
        const cls = total >= 10 ? 'badge-green' : total >= 5 ? 'badge-amber' : 'badge-red';
        countEl.className = `badge ${cls} text-xs`;
        countEl.textContent = `${total} sentence${total !== 1 ? 's' : ''}`;

        if (!text.trim()) {
          listEl.innerHTML = '<p class="text-ovos-muted">Your translated lines will expand here as you type.<br>Use <span class="mono">(option1|option2)</span> for alternatives and <span class="mono">[optional]</span> for optional words.</p>';
        } else if (total === lineCount) {
          // No expansion needed (no alternatives)
          listEl.innerHTML = samples.map((s, i) =>
            `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
          ).join('') + '<div class="text-ovos-muted mt-2 text-xs">Tip: use <span class="mono">(word1|word2)</span> to add alternative phrasings.</div>';
        } else {
          listEl.innerHTML = `<div class="text-ovos-muted mb-1">${lineCount} template${lineCount>1?'s':''} → ${total} unique sentences</div>` +
            samples.map((s, i) =>
              `<div class="px-1 rounded ${i % 2 ? '' : 'bg-ovos-bg/30'}">${highlightSlots(escapeHtml(s))}</div>`
            ).join('') + (total > samples.length ? `<div class="text-ovos-muted mt-1">... and ${total - samples.length} more</div>` : '');
        }
      }, 250);
    }

    // --- JSON preview ---
    function updateJsonPreview() {
      const preview = document.getElementById('json-preview');
      const status = document.getElementById('json-status');
      if (!preview || !status) return;

      // Reconstruct JSON from form fields
      const fields = document.querySelectorAll('.json-field');
      const srcEntries = window._editorFileData?.langs?.[document.getElementById('src-lang-select')?.value || 'en-US']?.entries || [];

      const obj = {};
      // Start with non-translatable fields from source
      for (const e of srcEntries) {
        if (e.translatable === false && e.key) {
          if (e.index != null) {
            if (!obj[e.key]) obj[e.key] = [];
            obj[e.key].push(e.text);
          } else {
            obj[e.key] = e.text;
          }
        }
      }
      // Add translatable fields from form
      fields.forEach(field => {
        const key = field.dataset.key;
        if (!key) return;
        if (field.dataset.list) {
          obj[key] = field.value.split('\n').filter(l => l.trim());
        } else {
          obj[key] = field.value;
        }
      });

      if (Object.keys(obj).length === 0) {
        preview.innerHTML = '<span class="text-ovos-muted">Empty</span>';
        status.textContent = '';
        return;
      }

      const formatted = JSON.stringify(obj, null, 2);
      preview.innerHTML = highlightJson(escapeHtml(formatted));
      status.innerHTML = '<span class="text-green-400">valid JSON</span>';
    }

    async function handleAutoTranslate(tgtLang) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;

      // Get source lines from the reference language
      const { skillId, fileKey, srcLang: editorSrcLang } = editor.dataset;
      const fromLang = editorSrcLang || 'en-US';
      if (!skillId) { toast('Cannot determine skill', 'red'); return; }

      let sourceLines;
      try {
        const skill = await fetchSkill(skillId);
        const fd = skill.files[fileKey];
        const srcLangData = fd?.langs?.[fromLang];
        if (!srcLangData?.entries?.length) { toast(`No source file in ${fromLang} to translate from`, 'red'); return; }
        sourceLines = srcLangData.entries.map(e => e.text);
      } catch (e) {
        toast(`Failed to load source: ${e.message}`, 'red'); return;
      }

      const hasExisting = editor.value.trim().length > 0;
      if (hasExisting && !confirm('This will replace the current translation with an auto-translated version. Continue?')) return;

      const serverUrl = getTranslateServer();
      const btn = document.getElementById('auto-tx-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;

      try {
        const translated = await autoTranslateLines(sourceLines, tgtLang, serverUrl, (done, total) => {
          btn.innerHTML = `<span class="spinner"></span> ${done}/${total}`;
        }, fromLang);

        editor.value = translated.join('\n');
        editor.dispatchEvent(new Event('input'));
        toast(`Auto-translated ${translated.length} lines. Review and edit before submitting!`, 'green', 5000);
      } catch (e) {
        toast(`Translation failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }

    function runClientValidation() {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;
      const text = editor.value;
      const fileType = editor.dataset.fileType;
      const ctx = window._editorCtx;
      const issues = [];

      // Empty check
      const lines = text.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
      if (!text.trim()) {
        issues.push({ severity: 'error', message: 'File is empty' });
      }

      if (fileType === 'intent') {
        // Expansion count
        const expanded = expandAllLines(text);
        if (expanded.total > 0 && expanded.total < 10) {
          issues.push({ severity: 'warning', message: `Only ${expanded.total} expanded sentences (10+ recommended for Padatious)` });
        }
        // Unbalanced parentheses
        for (let i = 0; i < lines.length; i++) {
          const opens = (lines[i].match(/\(/g) || []).length;
          const closes = (lines[i].match(/\)/g) || []).length;
          if (opens !== closes) issues.push({ severity: 'error', message: `Unbalanced parentheses on line: "${lines[i].substring(0, 40)}..."` });
        }
        // Slot preservation
        if (ctx?.slots?.length) {
          const usedSlots = new Set(text.match(/\{(\w+)\}/g)?.map(s => s.slice(1,-1)) || []);
          for (const s of ctx.slots) {
            if (!usedSlots.has(s)) issues.push({ severity: 'error', message: `Missing slot {${s}} — must be kept in translation` });
          }
        }
      }

      if (fileType === 'dialog') {
        // Slot preservation
        if (ctx?.slots?.length) {
          const usedSlots = new Set(text.match(/\{(\w+)\}/g)?.map(s => s.slice(1,-1)) || []);
          for (const s of ctx.slots) {
            if (!usedSlots.has(s)) issues.push({ severity: 'error', message: `Missing variable {${s}} — must be kept in translation` });
          }
        }
        // Few variants
        if (lines.length > 0 && lines.length < 2) {
          issues.push({ severity: 'warning', message: 'Only 1 response variant — 2+ recommended for natural speech variety' });
        }
      }

      if (fileType === 'voc') {
        // Long keywords
        for (const line of lines) {
          if (line.split(/\s+/).length > 5) {
            issues.push({ severity: 'warning', message: `Long keyword: "${line.substring(0,30)}..." — vocab entries should be 1-3 words` });
          }
        }
      }

      if (fileType === 'rx') {
        // Regex compilation
        for (const line of lines) {
          try { new RegExp(line); } catch (e) {
            issues.push({ severity: 'error', message: `Invalid regex: "${line.substring(0,30)}..." — ${e.message}` });
          }
        }
      }

      if (editor.dataset.isJson) {
        try { JSON.parse(text); } catch (e) {
          issues.push({ severity: 'error', message: `Invalid JSON: ${e.message}` });
        }
      }

      // Show results
      const errors = issues.filter(i => i.severity === 'error');
      const warnings = issues.filter(i => i.severity === 'warning');

      if (issues.length === 0) {
        toast('No issues found!', 'green');
        return;
      }

      let body = '';
      if (errors.length) {
        body += `<div class="mb-3"><div class="text-sm font-bold text-red-400 mb-1">${errors.length} error${errors.length>1?'s':''}</div>`;
        body += errors.map(i => `<div class="text-xs text-red-400 flex items-start gap-1 mb-1"><span>&#9679;</span> ${escapeHtml(i.message)}</div>`).join('');
        body += '</div>';
      }
      if (warnings.length) {
        body += `<div><div class="text-sm font-bold text-yellow-400 mb-1">${warnings.length} warning${warnings.length>1?'s':''}</div>`;
        body += warnings.map(i => `<div class="text-xs text-yellow-400 flex items-start gap-1 mb-1"><span>&#9651;</span> ${escapeHtml(i.message)}</div>`).join('');
        body += '</div>';
      }

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:28rem">
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-lg font-bold">Validation results</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text text-lg px-2">&times;</button>
            </div>
            ${body}
            <div class="mt-4 text-center">
              <button onclick="closeModal()" class="px-4 py-2 text-sm rounded-lg border border-ovos-card hover:bg-ovos-hover">Close</button>
            </div>
          </div>
        </div>`;
    }

      document.getElementById('modal-container').innerHTML = `

            <div class="flex items-center justify-between mb-3 flex-shrink-0">
              <h3 class="text-lg font-bold">Translation context</h3>
              <button onclick="closeModal()" class="text-ovos-muted hover:text-ovos-text text-lg px-2">&times;</button>
            </div>

    function changeSrcLang(newSrcLang, skillId, fileKeyEncoded, lang) {
      // Store the new source language preference and re-render

    function insertSlot(name) {
      const editor = document.getElementById('translation-editor');
      if (!editor) return;
      const s = editor.selectionStart, e = editor.selectionEnd;
      const ins = `{${name}}`;
      editor.value = editor.value.substring(0, s) + ins + editor.value.substring(e);
      editor.selectionStart = editor.selectionEnd = s + ins.length;
      editor.focus();
      editor.dispatchEvent(new Event('input'));
    }

    async function handleSubmitPR() {
      const editor = document.getElementById('translation-editor');
      const newContent = editor.value;
      if (newContent === editor.dataset.originalText) { toast('No changes to submit', 'amber'); return; }
      if (!newContent.trim()) { toast('Translation is empty', 'red'); return; }
      const { org, repo, filePath, lang, fileKey, branch } = editor.dataset;
      if (!filePath) { toast('Cannot determine file path — use "Edit on GitHub" instead', 'red'); return; }
      const lines = newContent.split('\n').filter(l => l.trim()).length;
      if (!confirm(`Submit ${lines} line(s) for "${fileKey}" (${lang})?\n\nA bot will open a pull request to ${org}/${repo} on your behalf.`)) return;
      const btn = document.getElementById('submit-pr-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Submitting...';
      try {
        const content = newContent.endsWith('\n') ? newContent : newContent + '\n';
        await submitTranslation(org, repo, filePath, content, lang, fileKey, branch);
        editor.dataset.originalText = editor.value;
        document.getElementById('editor-status').innerHTML = '<span class="badge badge-green">submitted!</span>';
      } catch (e) {
        toast(`Failed: ${e.message}`, 'red', 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit translation';
      }
    }

    // =========================================================================
    // SUBMIT SKILL
    // =========================================================================
    async function renderSubmitSkill(el) {
      el.innerHTML = `
        <div class="max-w-xl mx-auto py-10">
          <h1 class="text-2xl font-bold mb-2">Submit a Skill</h1>
          <p class="text-ovos-muted mb-6">Add an OpenVoiceOS skill to OVOS Localize so the community can translate it. The skill must be a public GitHub repository with a <code>locale/</code> directory.</p>

          <div class="bg-ovos-card rounded-xl p-6 space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1" for="skill-repo-input">GitHub repository <span class="text-ovos-muted font-normal">(org/repo)</span></label>
              <input id="skill-repo-input" type="text" placeholder="e.g. OpenVoiceOS/ovos-skill-weather"
                class="w-full bg-ovos-bg border border-ovos-card rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-ovos-accent font-mono"
                oninput="window._skillRepoInputChanged()" />
            </div>

            <div id="skill-validation-status" class="text-sm min-h-[1.5rem]"></div>

            <button id="skill-submit-btn" disabled
              onclick="window._submitSkillIssue()"
              class="w-full py-2 px-4 rounded-lg text-sm font-medium bg-ovos-accent text-white disabled:opacity-40 disabled:cursor-not-allowed hover:enabled:opacity-90 transition-opacity">
              Validate &amp; Submit
            </button>
          </div>

          <div class="mt-6 text-xs text-ovos-muted space-y-1">
            <p>Submitting opens a GitHub Issue. A bot reviews it and opens a pull request adding your skill to <code>skills.txt</code>. The skill will appear in OVOS Localize after the next daily data refresh.</p>
            <p>Already tracked skills will be rejected automatically.</p>
          </div>
        </div>`;

      // Wire up debounced validation
      let _debounceTimer = null;
      window._skillValidationState = null;

      window._skillRepoInputChanged = () => {
        clearTimeout(_debounceTimer);
        const input = document.getElementById('skill-repo-input');
        const status = document.getElementById('skill-validation-status');
        const btn = document.getElementById('skill-submit-btn');
        const val = (input?.value || '').trim();

        window._skillValidationState = null;
        btn.disabled = true;

        if (!val) { status.innerHTML = ''; return; }

        if (!/^[^/]+\/[^/]+$/.test(val)) {
          status.innerHTML = '<span class="text-amber-400">⚠ Enter in <code>org/repo</code> format</span>';
          return;
        }

        status.innerHTML = '<span class="text-ovos-muted">Checking…</span>';

        _debounceTimer = setTimeout(() => window._validateSkillRepo(val), 600);
      };

      window._validateSkillRepo = async (repoStr) => {
        const status = document.getElementById('skill-validation-status');
        const btn = document.getElementById('skill-submit-btn');

        const fail = (msg) => {
          window._skillValidationState = null;
          btn.disabled = true;
          status.innerHTML = `<span class="text-red-400">✗ ${msg}</span>`;
        };
        const ok = (msg) => {
          window._skillValidationState = repoStr;
          btn.disabled = false;
          status.innerHTML = `<span class="text-green-400">✓ ${msg}</span>`;
        };

        try {
          // 1. Check if already tracked
          const skillsResp = await fetch('skills.txt');
          if (skillsResp.ok) {
            const skillsText = await skillsResp.text();
            const tracked = skillsText.split('\n')
              .map(l => l.trim())
              .filter(l => l && !l.startsWith('#'));
            if (tracked.some(l => l.toLowerCase() === repoStr.toLowerCase())) {
              fail('This skill is already tracked in OVOS Localize.');
              return;
            }
          }

          // 2. Check if a submission is already in progress
          const openResp = await fetch(
            `https://api.github.com/repos/${LOCALIZE_REPO}/issues?state=open&labels=add-skill&per_page=100`,
            { headers: { Accept: 'application/vnd.github+json' } }
          ).catch(() => null);
          if (openResp?.ok) {
            const openIssues = await openResp.json();
            const existing = openIssues.find(i => i.title?.toLowerCase().includes(repoStr.toLowerCase()));
            if (existing) {
              window._skillValidationState = null;
              btn.disabled = true;
              status.innerHTML = `<span class="text-amber-400">⏳ A submission for this skill is already open — <a href="${escapeHtml(existing.html_url)}" target="_blank" rel="noopener" class="underline">view issue ↗</a></span>`;
              return;
            }
          }

          // 3. Check repo exists and is public
          const repoResp = await fetch(`https://api.github.com/repos/${repoStr}`, {
            headers: { Accept: 'application/vnd.github+json' }
          });
          if (repoResp.status === 404) { fail('Repository not found. Is it public?'); return; }
          if (!repoResp.ok) { fail(`GitHub API error ${repoResp.status}.`); return; }
          const repoData = await repoResp.json();
          if (repoData.private) { fail('Repository is private. Only public repos can be tracked.'); return; }

          // 3. Find locale/ or res/ directory anywhere in the repo tree
          const treeResp = await fetch(
            `https://api.github.com/repos/${repoStr}/git/trees/HEAD?recursive=1`,
            { headers: { Accept: 'application/vnd.github+json' } }
          );
          if (!treeResp.ok) { fail(`Could not read repository tree (HTTP ${treeResp.status}).`); return; }
          const treeData = await treeResp.json();
          const entries = treeData.tree || [];
          // Find a tree node named 'locale' or 'res' that contains language subdirs
          const localeNode = entries.find(e =>
            e.type === 'tree' && (e.path === 'locale' || e.path.endsWith('/locale') ||
                                  e.path === 'res'    || e.path.endsWith('/res'))
          );
          if (!localeNode) {
            fail('No <code>locale/</code> or <code>res/</code> directory found anywhere in the repository. Is this an OVOS skill?');
            return;
          }
          const localePath = localeNode.path;

          ok(`Ready — ${repoData.full_name} has a locale directory at <code>${localePath}/</code>.`);
        } catch (e) {
          fail(`Validation failed: ${e.message}`);
        }
      };

      window._submitSkillIssue = () => {
        const repo = window._skillValidationState;
        if (!repo) return;
        const [org, repoName] = repo.split('/');
        const title = encodeURIComponent(`[add-skill] ${repo}`);
        const body = encodeURIComponent(
          `> Submitted via [OVOS Localize](https://openvoiceos.github.io/ovos-localize/). ` +
          `A bot will open a PR automatically.\n\n` +
          `<!-- ADD_SKILL_META\n` +
          `org: ${org}\n` +
          `repo: ${repoName}\n` +
          `-->`
        );
        window.open(`https://github.com/${LOCALIZE_REPO}/issues/new?title=${title}&labels=add-skill&body=${body}`, '_blank');
        toast('GitHub issue page opened — click "Submit new issue" to complete.', 'green', 6000);
      };
    }
  </script>
</body>
</html>
