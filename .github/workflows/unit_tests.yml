name: Unit Tests

on:
  push:
    branches: [dev]
    paths:
      - 'ovos_localize/**'
      - 'scripts/**'
      - 'data/**'
      - 'config/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/unit_tests.yml'
      - '.github/workflows/submit_translation.yml'
      - '.github/workflows/sweep_submission_branches.yml'
      - '.github/workflows/update_data.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [dev]
    paths:
      - 'ovos_localize/**'
      - 'scripts/**'
      - 'data/**'
      - 'config/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/unit_tests.yml'
      - '.github/workflows/submit_translation.yml'
      - '.github/workflows/sweep_submission_branches.yml'
      - '.github/workflows/update_data.yml'
      - '.github/scripts/**'
  workflow_dispatch: {}

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: "dev"
      test_path: "test/"

  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@dev
    with:
      ruff_args: ". --exclude _gh_automations"
