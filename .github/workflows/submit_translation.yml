name: Submit Translation PR

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issues:
        description: 'Comma-separated issue numbers to re-run, or the literal ALL to reprocess every open translation issue.'
        required: false
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select issues to process
        id: select
        uses: actions/github-script@v9
        with:
          script: |
            const isTranslation = (it) =>
              (it.labels || []).some((l) => l.name === 'translation') ||
              (it.title || '').startsWith('[translate]');
            let numbers = [];
            if (context.payload.issue) {
              if (isTranslation(context.payload.issue)) numbers = [context.payload.issue.number];
            } else {
              const raw = (context.payload.inputs && context.payload.inputs.issues || '').trim();
              if (raw.toUpperCase() === 'ALL') {
                const open = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                });
                numbers = open.filter((it) => !it.pull_request && isTranslation(it)).map((it) => it.number);
              } else if (raw) {
                numbers = [...new Set(
                  raw.split(',').map((s) => parseInt(s.trim(), 10)).filter((n) => Number.isInteger(n) && n > 0)
                )];
                const open = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                });
                numbers = numbers
                  .map((n) => open.find((it) => it.number === n))
                  .filter((it) => it && !it.pull_request && isTranslation(it))
                  .map((it) => it.number);
              } else {
                core.setFailed("No issues given. Pass a comma-separated list or the literal ALL to reprocess every open translation issue.");
                return;
              }
            }
            core.setOutput('matrix', JSON.stringify(numbers));

  create-pr:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    # Every github-script step in this job runs on the default GITHUB_TOKEN,
    # and each one writes to the issue: removeLabel and update on the success
    # path, addLabels on the path-mismatch path, createComment on both. With
    # no block here the token takes the repository default, which can be read
    # only. Then the mismatch path cannot apply invalid-file-path, and the
    # success path opens the target pull request and afterwards fails to
    # comment or close the source issue, leaving it open for the next
    # dispatch to submit a second time. contents: read is for the checkout of
    # this repository. The target repository is checked out, and its pull
    # request opened, with the App token, so this job needs no
    # pull-requests permission.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Parse issue body
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ matrix.issue }}
            });
            const body = issue.body || '';
            const meta = {};
            // Parse <!-- TRANSLATION_META ... --> block
            const match = body.match(/<!--\s*TRANSLATION_META\s+([\s\S]*?)-->/);
            if (!match) {
              core.setFailed('No TRANSLATION_META block found in issue body');
              return;
            }
            for (const line of match[1].trim().split('\n')) {
              const [key, ...rest] = line.split(':');
              if (key && rest.length) meta[key.trim()] = rest.join(':').trim();
            }
            // Extract content between <content> tags
            const contentMatch = body.match(/<content>([\s\S]*?)<\/content>/);
            if (!contentMatch) {
              core.setFailed('No <content> block found in issue body');
              return;
            }
            // Issue bodies are written by anyone. Every value below is used to
            // pick a repository, a file path and a branch, so each is checked
            // against what it is allowed to be before it goes any further.
            const NAME = /^[A-Za-z0-9._-]+$/;
            const LANG = /^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$/;
            const SUFFIX = /\.(intent|voc|dialog|entity|rx|value|json)$/;

            const fail = (m) => { core.setFailed(m); return false; };

            const required = ['org', 'repo', 'file_path', 'lang', 'file_key'];
            for (const k of required) {
              if (!meta[k]) return fail(`Missing ${k} in TRANSLATION_META`);
            }
            if (!NAME.test(meta.org)) return fail(`Invalid org: ${meta.org}`);
            if (!NAME.test(meta.repo)) return fail(`Invalid repo: ${meta.repo}`);
            if (!LANG.test(meta.lang)) return fail(`Invalid lang: ${meta.lang}`);
            // Resource names may contain spaces ("thats all.dialog"); what they
            // must not contain is a path separator.
            if (!/^[A-Za-z0-9._ -]+$/.test(meta.file_key)) {
              return fail(`Invalid file_key: ${meta.file_key}`);
            }
            if (meta.branch && !/^[A-Za-z0-9._\/-]+$/.test(meta.branch)) {
              return fail(`Invalid branch: ${meta.branch}`);
            }

            // The path must land inside a locale tree, under a language
            // directory, and carry a known resource suffix. Anything else is
            // a write to somewhere it has no business writing to.
            const parts = meta.file_path.split('/');
            const bad = parts.some((seg) => seg === '' || seg === '.' || seg === '..')
              || meta.file_path.includes('\\')
              || meta.file_path.includes('\0')
              || meta.file_path.startsWith('/');
            if (bad) return fail(`Unsafe file_path: ${meta.file_path}`);
            // The locale root may be nested inside a package directory, e.g.
            // ovos_core/intent_services/locale/en-US/stop.voc.
            if (parts.includes('.github')) return fail(`Unsafe file_path: ${meta.file_path}`);
            const rootIdx = parts.findIndex((seg) => seg === 'locale' || seg === 'res');
            if (rootIdx === -1) {
              return fail(`file_path must sit under locale/ or res/: ${meta.file_path}`);
            }
            if (parts.length < rootIdx + 3) {
              return fail(`file_path must include a language directory: ${meta.file_path}`);
            }
            if (!LANG.test(parts[rootIdx + 1])) {
              return fail(`Not a language directory: ${parts[rootIdx + 1]}`);
            }
            if (!SUFFIX.test(meta.file_path)) {
              return fail(`Not a translatable resource: ${meta.file_path}`);
            }
            if (!contentMatch[1].trim()) {
              return fail('Empty <content> block; refusing to blank the file');
            }

            for (const [k, v] of Object.entries(meta)) {
              core.setOutput(k, v);
            }
            core.setOutput('content_b64', contentMatch[1].trim());
            core.setOutput('author', issue.user.login);

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Subpath checkout: the target repo is checked out at the workspace
      # root later in this job and must find no git repo there.
      - name: Checkout ovos-localize
        uses: actions/checkout@v7
        with:
          path: .ovos-localize

      - name: Install ovos-localize
        run: pip install ./.ovos-localize

      # A submission carries both a language and a path. The page composes
      # the path, so a page defect can write one language's text over another
      # language's file (ovos-date-parser#333-#336 from ovos-localize#564).
      # The bot refuses that submission instead of opening the PR.
      - name: Check file_path against lang
        id: pathlang
        env:
          FILE_PATH: ${{ steps.parse.outputs.file_path }}
          LANG_TAG: ${{ steps.parse.outputs.lang }}
        run: |
          set +e
          ovos-localize-check-path-lang "$FILE_PATH" --lang "$LANG_TAG" \
            --rules-file .ovos-localize/data/locale_rules.json
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          # Only exit 1 is a judgement on the submitted path. Every other
          # status is the command failing to run at all: 3 is the rules
          # table missing or malformed, 127 is the command not installed, 2
          # is a bad argument, and anything else is an unhandled exception.
          # None of them is the translator's fault, so none of them labels
          # the issue.
          if [ "$STATUS" -ne 1 ]; then
            echo "::error::the path check did not run (exit $STATUS); the submission was not judged"
            exit 1
          fi
          echo "path_lang_mismatch=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Validate submitted content
        id: validate
        env:
          FILE_PATH: ${{ steps.parse.outputs.file_path }}
          CONTENT_B64: ${{ steps.parse.outputs.content_b64 }}
        run: |
          echo "$CONTENT_B64" | base64 -d > /tmp/submission_content
          if ! ovos-localize-validate-submission "$FILE_PATH" --content-file /tmp/submission_content > /tmp/validation_output 2>&1; then
            cat /tmp/validation_output
            {
              echo "validation_failed<<EOF"
              cat /tmp/validation_output
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOCALIZE_APP_ID }}
          private-key: ${{ secrets.LOCALIZE_APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.org }}
          repositories: ${{ steps.parse.outputs.repo }}

      - name: Resolve base branch
        id: base
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ steps.parse.outputs.org }}
          REPO: ${{ steps.parse.outputs.repo }}
          WANTED: ${{ steps.parse.outputs.branch }}
        run: |
          # The submitted branch is a hint. Repos differ (dev / main / master),
          # so verify it exists and fall back to the repo's default branch.
          if [ -n "$WANTED" ] && gh api "repos/$ORG/$REPO/branches/$WANTED" --silent 2>/dev/null; then
            RESOLVED="$WANTED"
          else
            RESOLVED="$(gh api "repos/$ORG/$REPO" --jq .default_branch)"
            echo "::warning::branch '$WANTED' not found on $ORG/$REPO; using default '$RESOLVED'"
          fi
          echo "branch=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.parse.outputs.org }}/${{ steps.parse.outputs.repo }}
          ref: ${{ steps.base.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Create branch and commit
        id: commit
        env:
          FILE_PATH: ${{ steps.parse.outputs.file_path }}
          LANG: ${{ steps.parse.outputs.lang }}
          FILE_KEY: ${{ steps.parse.outputs.file_key }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          CONTENT_B64: ${{ steps.parse.outputs.content_b64 }}
        run: |
          BRANCH_NAME="translate/${LANG}/${FILE_KEY//[^a-zA-Z0-9_.-]/_}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          mkdir -p "$(dirname "$FILE_PATH")"
          echo "$CONTENT_B64" | base64 -d > /tmp/submission_content
          # A .voc or a .dialog file holds one value per line and the editor
          # sends exactly that, so it is written through. A .json resource is a
          # flat object, and the same payload written straight to it is not
          # JSON at all: ovos-workshop#659 committed two bare lines over
          # word_connectors.json and the pull request could not merge (T-4252).
          # The renderer maps the lines onto the keys of the file already here,
          # in that file's own order, or refuses. It runs before the commit, so
          # a refusal pushes nothing.
          # ${FILE_PATH,,} lowercases the whole path, so this gate answers the
          # same question as is_json_resource(), which lowercases too. The
          # earlier *.json|*.JSON pair missed every other spelling, and
          # word_connectors.Json went to the raw write, which is the #659
          # defect again.
          case "${FILE_PATH,,}" in
            *.json)
              if ! ovos-localize-render-json --content-file /tmp/submission_content \
                   --existing-file "$FILE_PATH" --out "$FILE_PATH" > /tmp/render_output 2>&1; then
                cat /tmp/render_output
                {
                  echo "render_failed<<EOF"
                  cat /tmp/render_output
                  echo "EOF"
                } >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            *)
              cp /tmp/submission_content "$FILE_PATH"
              ;;
          esac
          git config user.name "ovos-localize[bot]"
          git config user.email "ovos-localize[bot]@users.noreply.github.com"
          git add "$FILE_PATH"
          git commit -m "translate(${LANG}): update ${FILE_KEY}" -m "Submitted by @${AUTHOR} via OVOS Localize"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Passed as environment variables rather than expanded into the
          # script body: these come from an issue anyone can write, and
          # template expansion would splice them in as shell source.
          ORG: ${{ steps.parse.outputs.org }}
          REPO: ${{ steps.parse.outputs.repo }}
          BASE: ${{ steps.base.outputs.branch }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch_name }}
          LANG: ${{ steps.parse.outputs.lang }}
          FILE_KEY: ${{ steps.parse.outputs.file_key }}
          FILE_PATH: ${{ steps.parse.outputs.file_path }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          ISSUE: ${{ matrix.issue }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$ORG/$REPO" \
            --base "$BASE" \
            --head "$HEAD_BRANCH" \
            --title "translate($LANG): update $FILE_KEY" \
            --body "> 🤖 Opened automatically by ovos-localize from a community translation submission — the translation text is human-authored by the submitter; the PR itself is tool-generated and NOT reviewed by a maintainer. Verify before merging.

          ## Translation update

          - **Language**: \`$LANG\`
          - **File**: \`$FILE_PATH\`
          - **Submitted by**: @$AUTHOR
          - **Source issue**: $GITHUB_REPOSITORY#$ISSUE

          Submitted via [OVOS Localize](https://openvoiceos.github.io/ovos-localize/).
          Triggered by #$ISSUE.")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Close issue with PR link
        uses: actions/github-script@v9
        with:
          script: |
            const prUrl = '${{ steps.pr.outputs.pr_url }}';
            const issueNumber = ${{ matrix.issue }};
            // A re-run of a submission that was refused for its path now
            // passes, so the label that reported the refusal comes off.
            // Tidying the label must never stop the pull request link from
            // being posted or the issue from being closed: a 403 or a 5xx
            // here would leave the issue open, and the next dispatch would
            // open a second pull request for the same translation.
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'invalid-file-path'
              });
            } catch (error) {
              if (error.status !== 404) {
                core.warning(`could not remove the invalid-file-path label: ${error.status} ${error.message}`);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ **Translation PR created!**\n\n${prUrl}\n\nThe skill maintainer will review and merge it. Thank you for contributing!`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Report failure on the issue
        if: failure()
        env:
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.validation_failed }}
          RENDER_OUTPUT: ${{ steps.commit.outputs.render_failed }}
          PATH_LANG_MISMATCH: ${{ steps.pathlang.outputs.path_lang_mismatch }}
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueNumber = ${{ matrix.issue }};
            // A path that names another language is a page defect, not a
            // translator mistake. The issue gets a label and no comment, so
            // that a maintainer fixes the page and re-runs the issue.
            if (process.env.PATH_LANG_MISMATCH === 'true') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['invalid-file-path']
              });
              return;
            }
            const validationOutput = process.env.VALIDATION_OUTPUT || process.env.RENDER_OUTPUT || '';
            const validationSection = validationOutput
              ? `**Your translation did not pass validation:**\n\n\`\`\`\n${validationOutput}\n\`\`\`\n\nPlease fix the flagged line(s) and open a new submission.\n\n`
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `⚠️ **This translation could not be turned into a pull request.**\n\n` +
                    validationSection +
                    `Your translation is safe -- it is stored in this issue and nothing is lost. ` +
                    `A maintainer has been alerted and will re-run it.\n\n` +
                    `Details: ${run}`
            });
