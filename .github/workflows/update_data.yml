name: Update translation data
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - skills.txt
      - scripts/**
      - ovos_localize/**

# Shared with poll_merged_fixes.yml so refreshes serialize with the poller.
concurrency:
  group: translation-data-refresh-dev
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package
        run: pip install -e ".[dev]" --pre -c https://raw.githubusercontent.com/OpenVoiceOS/OpenVoiceOS/refs/heads/main/constraints-alpha.txt

      - name: Generate data
        run: python scripts/generate_data.py
        env:
          GIT_TERMINAL_PROMPT: 0

      # Publish what the site serves before anything else runs. Marking the
      # corpus step continue-on-error is not enough: it ends as cancelled
      # rather than failed, which skips everything after it regardless.
      - name: Publish browse data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update translation data"
          file_pattern: "data/**"

      # The training corpora are a side product and are allowed to fail.
      - name: Generate ML datasets
        run: python scripts/generate_datasets.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Publish training corpora
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update training corpora"
          file_pattern: "data/datasets/**"
