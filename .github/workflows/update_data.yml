name: Update translation data
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - skills.txt
      - scripts/**
      - ovos_localize/**

# Shared with poll_merged_fixes.yml so refreshes serialize with the poller.
concurrency:
  group: translation-data-refresh-dev
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package
        run: pip install -e ".[dev]" --pre -c https://raw.githubusercontent.com/OpenVoiceOS/OpenVoiceOS/refs/heads/main/constraints-alpha.txt

      - name: Generate data
        run: python scripts/generate_data.py
        env:
          GIT_TERMINAL_PROMPT: 0

      # Publish what the site serves before anything else runs. Marking the
      # corpus step continue-on-error is not enough: it ends as cancelled
      # rather than failed, which skips everything after it regardless.
      - name: Publish browse data
        run: |
          ./.github/scripts/commit_data.sh "chore: update translation data" "data/**"

      # The training corpora are a side product and are allowed to fail.
      - name: Generate ML datasets
        run: python scripts/generate_datasets.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Publish training corpora
        if: always()
        run: |
          ./.github/scripts/commit_data.sh "chore: update training corpora" "data/datasets/**"

      # The intent CSV and the intents corpus come from one read of
      # data/skills. The export fails when the corpus and the CSV are not
      # equivalent, or when train and test overlap, and then nothing is
      # published.
      - name: Export intent datasets
        id: export_intents
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: ovos-localize-export-intents --skills data/skills --out "${RUNNER_TEMP}/intents-export"

      # Publishes the corpus tree to the localize-daily branch of
      # OpenVoiceOS/ovos-intents, add-only, creating the branch on the first
      # run. main belongs to ovos-m2v-pipeline and is never written. Requires
      # an HF_TOKEN Actions secret with write access to that dataset. A
      # missing secret or a failed publish fails the run.
      - name: Publish intent datasets to Hugging Face
        if: always() && steps.export_intents.outcome == 'success'
        timeout-minutes: 15
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/publish_hf_dataset.py
