name: Update translation data
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - skills.txt
      - scripts/**
      - ovos_localize/**

# Shared with poll_merged_fixes.yml so refreshes serialize with the poller.
concurrency:
  group: translation-data-refresh-dev
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install package
        run: pip install -e ".[dev]" --pre -c https://raw.githubusercontent.com/OpenVoiceOS/OpenVoiceOS/refs/heads/main/constraints-alpha.txt

      - name: Generate data
        run: python scripts/generate_data.py
        env:
          GIT_TERMINAL_PROMPT: 0

      # The training corpora are a side product. What translators see is the
      # browse data generated above, so a failure here must not stop that
      # from being published -- it did, and merged translations sat
      # unpublished while every refresh failed at this step.
      - name: Generate ML datasets
        run: python scripts/generate_datasets.py
        continue-on-error: true
        timeout-minutes: 15

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update translation data"
          file_pattern: "data/**"
