name: Update translation data
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - skills.txt
      - scripts/**
      - ovos_localize/**

# Shared with poll_merged_fixes.yml so refreshes serialize with the poller.
concurrency:
  group: translation-data-refresh-dev
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package
        run: pip install -e ".[dev]" --pre -c https://raw.githubusercontent.com/OpenVoiceOS/OpenVoiceOS/refs/heads/main/constraints-alpha.txt

      - name: Generate data
        run: python scripts/generate_data.py
        env:
          GIT_TERMINAL_PROMPT: 0

      # Publish what the site serves before anything else runs. Marking the
      # corpus step continue-on-error is not enough: it ends as cancelled
      # rather than failed, which skips everything after it regardless.
      - name: Publish browse data
        run: |
          ./.github/scripts/commit_data.sh "chore: update translation data" "data/**"

      # The training corpora are a side product and are allowed to fail.
      - name: Generate ML datasets
        run: python scripts/generate_datasets.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Publish training corpora
        if: always()
        run: |
          ./.github/scripts/commit_data.sh "chore: update training corpora" "data/datasets/**"

      # Mirrors data/datasets/ into the data/datasets/ path of the published
      # HF dataset repo, and regenerates ovos_localize_intents.csv at that
      # repo's root from the current classification corpus so the flat
      # export and datasets-server stats stay in sync with the daily
      # refresh instead of freezing at whenever the CSV was last hand-
      # uploaded. Requires an HF_TOKEN Actions secret with write access to
      # OpenVoiceOS/ovos-localize-intents; skips quietly if unset so a
      # missing secret never reddens the daily refresh, and an HF outage
      # can't either since the step is non-fatal.
      - name: Publish training corpora to Hugging Face
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN secret is not set; skipping Hugging Face publish."
            exit 0
          fi
          pip install -U huggingface_hub
          python .github/scripts/publish_hf_dataset.py
